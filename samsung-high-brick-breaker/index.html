<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: #070a14;
    color: #eaf0ff;
  }

  body {
    font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic",
                 "Nanum Gothic", system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-overflow-scrolling: auto;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  #app {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* ---------- 상단 스코어보드 ---------- */
  #hud {
    flex: 0 0 auto;
    padding: calc(5px + env(safe-area-inset-top, 0px)) 8px 6px;
    background:
      linear-gradient(180deg, #16203c 0%, #0b1224 62%, #090e1c 100%);
    border-bottom: 1px solid rgba(120, 170, 255, 0.18);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    display: flex;
    flex-direction: column;
    gap: 5px;
    position: relative;
    z-index: 10;
  }

  .hud-top { display: flex; align-items: center; gap: 8px; }

  h1 {
    flex: 1 1 auto;
    min-width: 0;
    font-size: clamp(12px, 3.6vw, 16px);
    font-weight: 900;
    letter-spacing: -0.3px;
    line-height: 1.15;
    color: #ffe08a;
    text-shadow: 0 1px 0 rgba(0, 0, 0, 0.65);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .hud-actions { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }

  .icon-btn {
    width: 32px; height: 32px;
    display: grid; place-items: center;
    font-size: 15px; line-height: 1;
    border-radius: 9px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    background: rgba(255, 255, 255, 0.07);
    color: #eaf0ff;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    touch-action: manipulation;
  }
  .icon-btn:active { transform: scale(0.94); background: rgba(255, 255, 255, 0.16); }

  /* 스코어보드 격자 */
  .sb {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 4px;
    font-variant-numeric: tabular-nums;
  }
  /* 넓은 화면: 스코어보드를 한 줄 6칸으로 */
  @media (min-width: 640px) {
    .sb { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 5px; }
    .sb .cell { padding: 4px 8px 5px; }
    .cell .val { font-size: 14px; }
    .cell .val.big { font-size: 17px; }
    .cell .val.dim { font-size: 13px; }
    .cell.item .head .val { font-size: 12px; }
    .bar { height: 5px; }
    #lives { font-size: 14px; }
  }
  .cell {
    display: flex;
    align-items: baseline;
    gap: 4px;
    min-width: 0;
    padding: 3px 6px 4px;
    border-radius: 7px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.075), rgba(255, 255, 255, 0.025));
    border: 1px solid rgba(255, 255, 255, 0.09);
    overflow: hidden;
  }
  .cell .lbl {
    flex: 0 0 auto;
    font-size: 8.5px;
    font-weight: 900;
    letter-spacing: 0.6px;
    color: #7f8fb8;
  }
  .cell .val {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: -0.3px;
    color: #ffffff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cell .val.big { font-size: 16px; color: #ffffff; }
  .cell .val.dim { color: #c8d6f5; font-size: 12px; }

  #score { display: inline-block; transform-origin: left center; }
  #score.pop { animation: pop 0.22s ease-out; }
  @keyframes pop {
    0% { transform: scale(1); }
    45% { transform: scale(1.2); color: #ffe08a; }
    100% { transform: scale(1); }
  }

  #combo.hot { color: #ffd76e; text-shadow: 0 0 10px rgba(255, 215, 110, 0.55); }
  #stageNum { color: #9fd0ff; }

  #lives { letter-spacing: 1px; font-size: 13px; }
  #lives .h { color: #ff5d78; text-shadow: 0 0 8px rgba(255, 93, 120, 0.55); }
  #lives .h.off { color: #33405f; text-shadow: none; }

  /* 장착 아이템 칸 */
  .cell.item { flex-direction: column; align-items: stretch; gap: 2px; padding-bottom: 3px; }
  .cell.item .head { display: flex; align-items: baseline; gap: 4px; }
  .cell.item .head .val { font-size: 11px; color: #9aa9cc; }
  .cell.item.on {
    border-color: rgba(255, 214, 92, 0.55);
    background: linear-gradient(180deg, rgba(255, 214, 92, 0.18), rgba(255, 214, 92, 0.04));
    box-shadow: 0 0 12px rgba(255, 200, 70, 0.22);
  }
  .cell.item.on.laser {
    border-color: rgba(124, 246, 255, 0.6);
    background: linear-gradient(180deg, rgba(124, 246, 255, 0.18), rgba(124, 246, 255, 0.04));
    box-shadow: 0 0 12px rgba(124, 226, 255, 0.25);
  }
  .cell.item.on .head .val { color: #ffe08a; }
  .cell.item.on.laser .head .val { color: #b6f6ff; }
  .bar {
    height: 4px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.12);
    overflow: hidden;
  }
  .bar i {
    display: block;
    height: 100%;
    width: 0%;
    border-radius: 3px;
    background: linear-gradient(90deg, #ffb347, #ffe07a);
    transition: width 0.08s linear;
  }
  .cell.item.laser .bar i { background: linear-gradient(90deg, #2fb7ff, #a9f7ff); }

  /* ---------- 게임 영역 ---------- */
  #stage {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
    background: #070a14;
  }

  #game {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  /* ---------- 오버레이 ---------- */
  #overlay {
    position: absolute;
    inset: 0;
    z-index: 8;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    text-align: center;
    background: radial-gradient(ellipse at 50% 38%, rgba(24, 34, 66, 0.88) 0%, rgba(6, 9, 18, 0.96) 78%);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  #overlay[hidden] { display: none; }

  .ov-inner {
    width: 100%;
    max-width: 350px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    animation: fadeUp 0.28s ease-out;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .badge {
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #ffd76e;
    border: 1px solid rgba(255, 215, 110, 0.45);
    border-radius: 999px;
    padding: 4px 12px;
    background: rgba(255, 215, 110, 0.08);
  }

  .ov-title {
    font-size: clamp(24px, 7.8vw, 34px);
    font-weight: 900;
    line-height: 1.12;
    letter-spacing: -1.2px;
    color: #ffffff;
    text-shadow: 0 3px 0 rgba(0, 0, 0, 0.45), 0 0 26px rgba(120, 160, 255, 0.35);
  }
  .ov-title span {
    background: linear-gradient(180deg, #ffe08a 0%, #ff9a5c 55%, #ff6f91 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .ov-sub { font-size: clamp(12px, 3.6vw, 14px); font-weight: 700; color: #b9c6e6; line-height: 1.5; }

  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; }
  .chip {
    font-size: 11.5px;
    font-weight: 800;
    color: #dbe6ff;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 7px;
    padding: 3px 8px;
  }

  /* 결과 스코어보드 */
  .board {
    width: 100%;
    border: 1px solid rgba(140, 180, 255, 0.18);
    border-radius: 12px;
    background: linear-gradient(180deg, rgba(16, 24, 46, 0.92), rgba(9, 14, 28, 0.92));
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    overflow: hidden;
  }
  .board .row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    padding: 7px 12px;
    font-size: 12.5px;
    font-weight: 800;
    border-bottom: 1px solid rgba(255, 255, 255, 0.07);
  }
  .board .row:last-child { border-bottom: none; }
  .board .row span { color: #8b9ac2; font-weight: 700; }
  .board .row b { color: #eaf0ff; font-variant-numeric: tabular-nums; }
  .board .row.hl { background: rgba(255, 214, 92, 0.08); }
  .board .row.hl b { color: #ffe08a; font-size: 17px; letter-spacing: -0.4px; }

  .btn {
    width: 100%;
    min-height: 48px;
    padding: 12px 18px;
    border-radius: 13px;
    border: none;
    font-family: inherit;
    font-size: 15.5px;
    font-weight: 900;
    letter-spacing: -0.3px;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    touch-action: manipulation;
    transition: transform 0.08s ease, filter 0.15s ease;
  }
  .btn:active { transform: translateY(1px) scale(0.99); }

  .btn.primary {
    color: #21150a;
    background: linear-gradient(180deg, #ffe07a 0%, #ffb347 60%, #ff8a5c 100%);
    box-shadow: 0 6px 20px rgba(255, 160, 70, 0.32), inset 0 -2px 0 rgba(0, 0, 0, 0.16);
  }

  .btn.ghost {
    min-height: 42px;
    font-size: 13.5px;
    color: #dbe6ff;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.16);
  }

  .ov-row { display: flex; gap: 8px; width: 100%; }

  .ov-hint { font-size: 11.5px; color: #8391b8; line-height: 1.55; font-weight: 600; }
  .ov-hint b { color: #ffd76e; }
  .ov-best { font-size: 12px; color: #ffd76e; font-weight: 800; }

  /* 아이템 소개 (시작 화면) */
  .itemlist {
    display: flex;
    flex-direction: column;
    gap: 2px;
    font-size: 10.5px;
    line-height: 1.55;
    font-weight: 700;
    color: #9fb0d6;
  }
  .itemlist b { color: #e2ecff; font-weight: 900; }

  /* ---------- 스테이지 클리어: 동문 사진 배경 ---------- */
  #overlay.ov-photo:not([hidden]) {
    display: block;
    padding: 0;
    background: #05070f;
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
    overflow: hidden;
  }
  .photo-stage { position: absolute; inset: 0; overflow: hidden; }
  .photo-bg {
    position: absolute;
    inset: -8%;
    background-size: cover;
    background-position: center;
    filter: blur(26px) saturate(1.3) brightness(0.55);
    transform: scale(1.08);
  }
  .photo-img {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center 42%;
    animation: photoIn 0.55s ease-out;
  }
  @keyframes photoIn {
    from { opacity: 0; transform: scale(1.03); }
    to { opacity: 1; transform: scale(1); }
  }
  .photo-shade {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(180deg, rgba(4, 7, 14, 0.44) 0%, rgba(4, 7, 14, 0) 24%, rgba(4, 7, 14, 0) 52%, rgba(4, 7, 14, 0.72) 100%);
    transition: background 0.22s ease;
  }
  .fx-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .photo-toggle {
    position: absolute;
    top: calc(8px + env(safe-area-inset-top, 0px));
    right: 8px;
    z-index: 6;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 7px 11px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.26);
    background: rgba(10, 16, 32, 0.62);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    color: #f2f6ff;
    font-family: inherit;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: -0.2px;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    touch-action: manipulation;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
  }
  .photo-toggle:active { transform: scale(0.96); }

  .clear-card {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 4;
    padding: 22px 10px calc(9px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(180deg, rgba(5, 8, 16, 0) 0%, rgba(5, 8, 16, 0.46) 32%, rgba(5, 8, 16, 0.86) 100%);
    transition: opacity 0.22s ease, transform 0.22s ease;
    animation: cardUp 0.36s ease-out;
  }
  @keyframes cardUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .clear-card .inner {
    width: 100%;
    max-width: 430px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 7px;
    padding: 10px 12px;
    border-radius: 15px;
    border: 1px solid rgba(150, 190, 255, 0.22);
    background: rgba(9, 15, 30, 0.56);
    -webkit-backdrop-filter: blur(12px) saturate(1.3);
    backdrop-filter: blur(12px) saturate(1.3);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
  }
  .cc-head {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 4px 8px;
  }
  .cc-title {
    font-size: clamp(17px, 4.9vw, 22px);
    font-weight: 900;
    letter-spacing: -0.8px;
    line-height: 1.15;
    color: #ffffff;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.65);
  }
  .cc-title span {
    background: linear-gradient(180deg, #ffe08a 0%, #ff9a5c 55%, #ff6f91 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .statbar { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; }
  .stat {
    display: inline-flex;
    align-items: baseline;
    gap: 4px;
    padding: 3px 9px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.09);
    border: 1px solid rgba(255, 255, 255, 0.13);
  }
  .stat i {
    font-style: normal;
    font-size: 9.5px;
    font-weight: 800;
    letter-spacing: 0.3px;
    color: #93a3c8;
  }
  .stat b {
    font-size: 13px;
    font-weight: 900;
    color: #eef3ff;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.2px;
  }
  .stat.hl b { color: #ffe08a; font-size: 15px; }
  .clear-card .btn { min-height: 42px; font-size: 14.5px; padding: 9px 14px; border-radius: 11px; }
  .clear-card .btn.ghost { min-height: 36px; font-size: 12.5px; }
  .clear-card .ov-hint { font-size: 11px; }

  /* 사진만 보기: 스코어 카드를 숨겨 사진을 온전히 본다 */
  #overlay.photo-only .clear-card {
    opacity: 0;
    transform: translateY(14px);
    pointer-events: none;
  }
  #overlay.photo-only .photo-shade {
    background: linear-gradient(180deg, rgba(4, 7, 14, 0.3) 0%, rgba(4, 7, 14, 0) 26%, rgba(4, 7, 14, 0) 72%, rgba(4, 7, 14, 0.34) 100%);
  }

  @media (max-height: 620px) {
    .clear-card { padding-top: 14px; }
    .clear-card .inner { gap: 5px; padding: 8px 10px; }
    .cc-title { font-size: 16px; }
    .stat { padding: 2px 7px; }
    .stat b { font-size: 12px; }
    .stat.hl b { font-size: 13px; }
    .clear-card .btn { min-height: 38px; font-size: 13.5px; }
  }

  /* 아이템 범례 */
  .legend {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    font-size: 11px;
    font-weight: 800;
  }
  .legend i {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    background: rgba(255, 255, 255, 0.05);
    font-style: normal;
    color: #dbe6ff;
  }
  .legend .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .legend .b .dot { background: #ffd45c; box-shadow: 0 0 8px #ffd45c; }
  .legend .l .dot { background: #7cf6ff; box-shadow: 0 0 8px #7cf6ff; }

  /* 가로 화면 / 낮은 화면: 시작·결과 화면이 스크롤 없이 들어가도록 압축 */
  @media (max-height: 620px) {
    #hud { padding-top: calc(4px + env(safe-area-inset-top, 0px)); padding-bottom: 4px; gap: 4px; }
    .icon-btn { width: 29px; height: 29px; font-size: 13px; }
    .cell .val { font-size: 12px; }
    .cell .val.big { font-size: 14px; }
    #overlay { padding: 10px; align-items: flex-start; }
    .ov-inner { gap: 7px; margin: auto 0; }
    .ov-title { font-size: clamp(19px, 5.6vw, 24px); }
    .ov-sub { font-size: 11.5px; line-height: 1.4; }
    .chips { display: none; }
    .ov-hint { display: none; }
    .badge { padding: 2px 10px; font-size: 9.5px; }
    .btn { min-height: 40px; font-size: 14.5px; padding: 9px 14px; }
    .btn.ghost { min-height: 36px; font-size: 12.5px; }
    .board .row { padding: 5px 10px; font-size: 11.5px; }
    .board .row.hl b { font-size: 15px; }
  }
  @media (max-height: 450px) {
    .ov-sub { display: none; }
    .badge { display: none; }
    .ov-inner { gap: 5px; }
    .ov-title { font-size: 19px; }
  }

  /* ---------- 토스트 ---------- */
  #toast {
    position: absolute;
    left: 50%;
    bottom: 20px;
    transform: translate(-50%, 14px);
    z-index: 20;
    max-width: 88%;
    padding: 9px 15px;
    border-radius: 999px;
    background: rgba(18, 26, 48, 0.96);
    border: 1px solid rgba(120, 160, 255, 0.35);
    color: #eaf0ff;
    font-size: 12px;
    font-weight: 800;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s ease, transform 0.22s ease;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hud-top">
      <h1>삼성고동문회 벽돌깨기</h1>
      <div class="hud-actions">
        <button id="btnPause" class="icon-btn" type="button" aria-label="일시정지" title="일시정지">❙❙</button>
        <button id="btnSound" class="icon-btn" type="button" aria-label="소리 끄기" title="소리 끄기">🔊</button>
      </div>
    </div>
    <div class="sb">
      <div class="cell"><span class="lbl">SCORE</span><span class="val big" id="score">0</span></div>
      <div class="cell"><span class="lbl">BEST</span><span class="val dim" id="best">0</span></div>
      <div class="cell"><span class="lbl">STAGE</span><span class="val dim" id="stageNum">1/3</span></div>
      <div class="cell"><span class="lbl">COMBO</span><span class="val dim" id="combo">x1</span></div>
      <div class="cell"><span class="lbl">LIVES</span><span class="val" id="lives"></span></div>
      <div class="cell item" id="itemCell">
        <div class="head"><span class="lbl">ITEM</span><span class="val" id="itemName">없음</span></div>
        <div class="bar"><i id="itemBar"></i></div>
      </div>
    </div>
  </header>

  <main id="stage">
    <canvas id="game" aria-label="삼성고동문회 벽돌깨기 게임 화면"></canvas>
    <div id="overlay" hidden></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </main>
</div>

<script>
(function () {
  'use strict';

  /* =========================================================
     기본 상수
     ========================================================= */
  var NAMES = ['이택형', '성승현', '우상봉', '강현수', '황진석', '강동균'];
  var MAX_STAGE = 3;
  var FONT = '"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Nanum Gothic",system-ui,-apple-system,sans-serif';

  // 스테이지별 이름 배치 순서 (같은 6명을 매번 다른 조합으로)
  var NAME_ORDER = [
    [0, 1, 2, 3, 4, 5],
    [3, 0, 5, 2, 4, 1],
    [5, 2, 4, 0, 3, 1]
  ];

  // 줄별 색 (위 → 아래) + 계열 (불·물 아이템이 노리는 벽돌)
  var ROW_COLORS = [
    ['#f4687a', '#bf2643', 'red'],
    ['#f9a94a', '#d4700f', 'other'],
    ['#57b0f0', '#1f6cbb', 'blue'],
    ['#41cf8d', '#12825a', 'other'],
    ['#ab8bfb', '#6338d1', 'other'],
    ['#f47ab8', '#bd1f78', 'red'],
    ['#5ad0e0', '#1c7f96', 'blue'],
    ['#c8c2ff', '#6a5bd6', 'other']
  ];

  // 아이템 정의
  var ITEMS = {
    bullet: { key: 'bullet', label: '총알', color: '#ffd45c', duration: 10, interval: 0.25 },
    laser:  { key: 'laser',  label: '레이저', color: '#7cf6ff', duration: 8,  interval: 0.55 },
    fire:   { key: 'fire',   label: '불',    color: '#ff7a3d', instant: true },
    water:  { key: 'water',  label: '물',    color: '#43b6ff', instant: true },
    multi:  { key: 'multi',  label: '멀티볼', color: '#ff9ee0', instant: true },
    wide:   { key: 'wide',   label: '와이드', color: '#a8f0ff', duration: 12 },
    shield: { key: 'shield', label: '실드',  color: '#8ef2b6', duration: 10 }
  };

  // 스테이지별 아이템 벽돌 종류·개수 (위치는 벽돌판 크기에 맞춰 자동 배치)
  var ITEM_SEQ = [
    ['bullet', 'fire', 'laser', 'water', 'wide'],
    ['shield', 'fire', 'multi', 'water', 'bullet', 'laser'],
    ['multi', 'water', 'shield', 'fire', 'bullet', 'laser', 'wide']
  ];

  var STORE_SOUND = 'sbb.sound';
  var STORE_BEST = 'sbb.best';

  /* =========================================================
     DOM
     ========================================================= */
  var stageEl = document.getElementById('stage');
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var overlayEl = document.getElementById('overlay');
  var toastEl = document.getElementById('toast');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var stageNumEl = document.getElementById('stageNum');
  var comboEl = document.getElementById('combo');
  var livesEl = document.getElementById('lives');
  var itemCellEl = document.getElementById('itemCell');
  var itemNameEl = document.getElementById('itemName');
  var itemBarEl = document.getElementById('itemBar');
  var btnPause = document.getElementById('btnPause');
  var btnSound = document.getElementById('btnSound');

  /* =========================================================
     스테이지 사진 (동문 모임 사진) — 미리 받아 둔다
     ========================================================= */
  var STAGE_PHOTOS = ['assets/stage1.jpg', 'assets/stage2.jpg', 'assets/stage3.jpg'];
  var stageImgs = [];

  (function preloadStagePhotos() {
    for (var i = 0; i < STAGE_PHOTOS.length; i++) {
      var im = new Image();
      im.decoding = 'async';
      im.alt = '';
      im.src = STAGE_PHOTOS[i];
      stageImgs.push(im);
      if (im.decode) {
        try { im.decode().catch(function () { /* 무시 */ }); } catch (e) { /* 무시 */ }
      }
    }
  })();

  function stagePhotoIndex(stage) {
    return Math.max(0, Math.min(STAGE_PHOTOS.length - 1, (stage || 1) - 1));
  }
  function stagePhotoUrl(stage) { return STAGE_PHOTOS[stagePhotoIndex(stage)]; }
  function stagePhoto(stage) {
    var im = stageImgs[stagePhotoIndex(stage)];
    return (im && im.complete && im.naturalWidth > 0) ? im : null;
  }

  /* =========================================================
     저장소 (프라이빗 모드 등 실패해도 게임은 계속)
     ========================================================= */
  function storeGet(key, def) {
    try {
      var v = window.localStorage.getItem(key);
      return v === null ? def : v;
    } catch (e) { return def; }
  }
  function storeSet(key, val) {
    try { window.localStorage.setItem(key, String(val)); } catch (e) { /* 무시 */ }
  }

  /* =========================================================
     소리 (Web Audio 합성, 외부 파일 없음)
     ========================================================= */
  var Sfx = {
    ac: null,
    master: null,
    enabled: storeGet(STORE_SOUND, '1') !== '0',

    ensure: function () {
      if (this.ac) return this.ac;
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try {
        this.ac = new AC();
        this.master = this.ac.createGain();
        this.master.gain.value = 0.22;
        this.master.connect(this.ac.destination);
      } catch (e) { this.ac = null; }
      return this.ac;
    },

    resume: function () {
      var ac = this.ensure();
      if (ac && ac.state === 'suspended' && ac.resume) {
        try { ac.resume(); } catch (e) { /* 무시 */ }
      }
    },

    tone: function (freq, dur, type, slideTo, vol, delay) {
      if (!this.enabled) return;
      var ac = this.ensure();
      if (!ac || !this.master) return;
      try {
        var t = ac.currentTime + (delay || 0);
        var osc = ac.createOscillator();
        var g = ac.createGain();
        osc.type = type || 'square';
        osc.frequency.setValueAtTime(freq, t);
        if (slideTo) {
          osc.frequency.exponentialRampToValueAtTime(Math.max(40, slideTo), t + dur);
        }
        var peak = (vol === undefined ? 0.5 : vol);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(peak, t + 0.008);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        osc.connect(g);
        g.connect(this.master);
        osc.start(t);
        osc.stop(t + dur + 0.03);
      } catch (e) { /* 무시 */ }
    },

    wall: function () { this.tone(340, 0.05, 'square', 300, 0.22); },
    paddle: function () { this.tone(520, 0.07, 'square', 700, 0.3); },
    brick: function (stage) { this.tone(720 + stage * 20, 0.08, 'triangle', 1080, 0.38); },
    chip: function () { this.tone(300, 0.05, 'sawtooth', 260, 0.2); },
    launch: function () { this.tone(420, 0.09, 'sine', 900, 0.32); },

    shoot: function () {
      // 짧고 날카로운 발사음
      this.tone(980, 0.045, 'square', 240, 0.16);
      this.tone(1500, 0.03, 'sawtooth', 600, 0.07);
    },
    laser: function () {
      // 스윕하는 레이저 신스
      this.tone(1600, 0.22, 'sawtooth', 180, 0.2);
      this.tone(2400, 0.16, 'sine', 400, 0.1, 0.01);
    },
    equip: function () {
      var self = this;
      [660, 880, 1320].forEach(function (f, i) {
        self.tone(f, 0.11, 'triangle', 0, 0.28, i * 0.06);
      });
    },
    capsule: function () { this.tone(880, 0.1, 'sine', 1320, 0.2); },

    fire: function () {
      var self = this;
      this.tone(240, 0.5, 'sawtooth', 60, 0.3);
      this.tone(90, 0.75, 'triangle', 38, 0.32, 0.04);
      for (var i = 0; i < 5; i++) {
        window.setTimeout(function () { self.tone(620 + Math.random() * 900, 0.07, 'triangle', 200, 0.1); }, 60 + i * 75);
      }
    },
    water: function () {
      var self = this;
      this.tone(920, 0.36, 'sine', 170, 0.26);
      this.tone(1500, 0.22, 'sine', 520, 0.14, 0.05);
      for (var i = 0; i < 4; i++) {
        window.setTimeout(function () { self.tone(520 + Math.random() * 700, 0.09, 'sine', 230, 0.09); }, 90 + i * 85);
      }
    },
    multi: function () {
      var self = this;
      [660, 880, 1120].forEach(function (f, i) { self.tone(f, 0.1, 'square', f * 1.5, 0.16, i * 0.05); });
    },
    power: function () {
      var self = this;
      [520, 780, 1040].forEach(function (f, i) { self.tone(f, 0.11, 'triangle', 0, 0.22, i * 0.06); });
    },
    bounce: function () { this.tone(300, 0.08, 'square', 640, 0.24); },

    lose: function () {
      var self = this;
      this.tone(400, 0.16, 'sawtooth', 180, 0.34);
      window.setTimeout(function () { self.tone(200, 0.24, 'sawtooth', 90, 0.3); }, 130);
    },
    clear: function () {
      var self = this;
      var notes = [523, 659, 784, 1046];
      notes.forEach(function (f, i) {
        window.setTimeout(function () { self.tone(f, 0.16, 'triangle', 0, 0.34); }, i * 95);
      });
    },
    over: function () {
      var self = this;
      var notes = [420, 350, 280, 180];
      notes.forEach(function (f, i) {
        window.setTimeout(function () { self.tone(f, 0.22, 'square', f * 0.86, 0.3); }, i * 130);
      });
    }
  };

  /* =========================================================
     게임 상태
     ========================================================= */
  var S = {
    state: 'start',            // start | ready | play | pause | clear | over | win
    prevState: 'play',
    W: 0, H: 0, dpr: 1,

    score: 0,
    best: parseInt(storeGet(STORE_BEST, '0'), 10) || 0,
    stage: 1,
    lives: 3,
    combo: 0,
    bestCombo: 0,
    broken: 0,

    cols: 6,
    rows: 7,
    speed: 330,

    bricks: [],
    particles: [],
    floaters: [],
    bullets: [],
    beams: [],
    capsules: [],
    waves: [],
    extraBalls: [],
    stars: [],

    weapon: { type: null, remaining: 0, total: 0, fireIn: 0 },
    wide: 0,            // 패들 확장 남은 시간
    shield: 0,          // 바닥 실드 남은 시간,

    paddle: { x: 0, y: 0, w: 90, h: 12, target: null, drag: null },
    ball: { x: 0, y: 0, vx: 0, vy: 0, r: 8, stuck: true, trail: [] },

    geo: { sidePad: 8, gap: 4, top: 16, w: 56, h: 34, font: 15 },

    keys: { left: false, right: false },
    shake: 0,
    time: 0,
    sinceBrick: 0
  };

  /* =========================================================
     레이아웃 (작은 벽돌: 촘촘한 격자)
     ========================================================= */
  function colsForWidth(w) {
    if (w < 420) return 6;      // 세로 모바일: 6열
    if (w < 700) return 7;
    return 8;
  }
  function rowsForCols(cols, h) {
    if (h < 430) return 5;
    if (h < 560) return 6;
    if (h < 700) return 7;
    return 8;
  }

  // 스테이지별 격자: 3스테이지는 벽돌이 더 작고 촘촘하다
  function gridForStage(stage, w, h) {
    var baseCols = colsForWidth(w);
    var baseRows = rowsForCols(baseCols, h);
    if (stage <= 1) return { cols: baseCols, rows: baseRows };
    if (stage === 2) return { cols: Math.min(9, baseCols + 1), rows: Math.min(9, baseRows + 1) };
    var cols3 = w < 420 ? 8 : (w < 700 ? 9 : 10);   // 모바일 세로 8열, 넓은 화면 10열
    var rows3 = Math.max(8, Math.min(10, baseRows + 3));
    return { cols: cols3, rows: rows3 };
  }

  function computeGeometry() {
    var W = S.W, H = S.H, cols = S.cols, rows = S.rows;

    var sidePad = Math.max(5, Math.min(12, Math.round(W * 0.022)));
    var gap = Math.max(3, Math.min(8, Math.round(W * 0.0105)));
    var availW = W - sidePad * 2;

    // 넓은 화면에서는 벽돌 벽 폭을 제한하고 가운데로 모아 벽돌이 지나치게 길쭉해지지 않게 한다
    var maxWallW = 1080;
    if (availW > maxWallW) {
      sidePad = (W - maxWallW) / 2;
      availW = maxWallW;
    }

    var bw = (availW - gap * (cols - 1)) / cols;

    var top = Math.max(8, Math.min(28, Math.round(H * 0.028)));

    // 벽돌 벽은 게임 영역의 절반까지만 차지한다 (패들·공 공간 확보)
    var wallBudget = Math.min(H * 0.52, H - 150);
    if (wallBudget < 90) wallBudget = Math.max(70, H * 0.4);
    var bhFit = (wallBudget - top - gap * (rows - 1)) / rows;

    var bh = Math.min(bw * 0.62, bhFit, 44);
    bh = Math.max(16, bh);

    var font = Math.min(bw / 3.45, bh * 0.54);
    font = Math.max(8.5, Math.min(30, font));

    S.geo = { sidePad: sidePad, gap: gap, top: top, w: bw, h: bh, font: font };

    S.paddle.w = (function () {
      var pw = Math.max(76, Math.min(210, W * 0.27));
      return S.wide > 0 ? pw * 1.5 : pw;
    })();
    S.paddle.h = Math.max(9, Math.min(14, Math.round(W * 0.024)));
    var bottomGap = Math.max(22, Math.min(44, H * 0.055));
    S.paddle.y = Math.round(H - bottomGap - S.paddle.h);

    S.ball.r = Math.max(5.5, Math.min(10, W * 0.019));

    var base = Math.min(W, H * 0.9) * 0.72;
    base = Math.max(275, Math.min(470, base));
    // 스테이지가 올라갈수록 공이 빠르다 (3스테이지는 확실히 더 빠르게)
    var boost = [1, 1.08, 1.22][Math.max(0, Math.min(2, S.stage - 1))];
    S.speed = base * boost;
  }

  function resize() {
    var rect = canvas.getBoundingClientRect();
    var W = Math.max(200, Math.round(rect.width || stageEl.clientWidth || 320));
    var H = Math.max(220, Math.round(rect.height || stageEl.clientHeight || 480));
    var prevW = S.W, prevH = S.H;

    S.W = W;
    S.H = H;
    S.dpr = Math.min(window.devicePixelRatio || 1, 3);

    canvas.width = Math.round(W * S.dpr);
    canvas.height = Math.round(H * S.dpr);
    ctx.setTransform(S.dpr, 0, 0, S.dpr, 0, 0);

    if (S.state === 'start') {
      var gs = gridForStage(S.stage, W, H);
      S.cols = gs.cols;
      S.rows = gs.rows;
    }
    computeGeometry();

    if (prevW > 0 && prevH > 0 && (prevW !== W || prevH !== H)) {
      var sx = W / prevW;
      S.paddle.x = S.paddle.x * sx;
      if (S.paddle.target !== null) S.paddle.target = S.paddle.target * sx;
      S.ball.x = S.ball.x * sx;
      S.ball.y = Math.min(S.ball.y, H - S.ball.r - 1);
    }
    clampPaddle();
    if (S.ball.stuck) stickBall();

    if (S.state === 'start') buildBricks(S.stage);
  }

  function clampPaddle() {
    var p = S.paddle;
    p.x = Math.max(p.w / 2, Math.min(S.W - p.w / 2, p.x));
  }

  /* =========================================================
     벽돌 생성 (아이템 벽돌 포함)
     ========================================================= */
  function itemPlanFor(stage) {
    var types = ITEM_SEQ[(stage - 1) % ITEM_SEQ.length];
    var rows = S.rows, cols = S.cols;
    var out = [];
    var used = {};
    var seed = (stage * 7919 + rows * 131 + cols * 17 + 12345) % 2147483647;
    function rnd() {
      seed = (seed * 1103515245 + 12345) % 2147483648;
      return seed / 2147483648;
    }
    var guard = 0;
    while (out.length < types.length && guard < 600) {
      guard += 1;
      var r = Math.floor(rnd() * rows);
      var c = Math.floor(rnd() * cols);
      var key = r + ':' + c;
      if (used[key]) continue;
      var clash = false;
      for (var i = 0; i < out.length; i++) {
        if (out[i].r === r && Math.abs(out[i].c - c) <= 1) { clash = true; break; }
      }
      if (clash) continue;
      used[key] = 1;
      out.push({ r: r, c: c, t: types[out.length] });
    }
    return out;
  }

  function buildBricks(stage) {
    var cols = S.cols, rows = S.rows;
    var order = NAME_ORDER[(stage - 1) % NAME_ORDER.length];
    var plan = itemPlanFor(stage);
    var list = [];

    function planAt(r, c) {
      for (var i = 0; i < plan.length; i++) {
        if (plan[i].r === r && plan[i].c === c) return plan[i].t;
      }
      return null;
    }

    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var nameIdx = order[(r % 2 === 0 ? (r * cols + c) : (r * cols + (cols - 1 - c))) % 6];
        var hp;
        if (stage === 1) hp = (r === 0) ? 2 : 1;
        else if (stage === 2) hp = (r <= 1) ? 2 : 1;
        else hp = (r <= 1) ? 3 : (r <= 5 ? 2 : 1);   // 3스테이지: 단단한 벽돌이 크게 늘어난다

        var it = planAt(r, c);
        if (it) hp = Math.max(hp, 2);

        var col = ROW_COLORS[r % ROW_COLORS.length];
        list.push({
          col: c,
          row: r,
          name: NAMES[nameIdx],
          hp: hp,
          maxHp: hp,
          alive: true,
          item: it,
          fam: col[2] || 'other',
          top: col[0],
          bottom: col[1],
          seed: (r * 7 + c * 13 + stage * 3) % 97,
          flash: 0
        });
      }
    }
    S.bricks = list;
  }

  function brickRect(b) {
    var g = S.geo;
    return {
      x: g.sidePad + b.col * (g.w + g.gap),
      y: g.top + b.row * (g.h + g.gap),
      w: g.w,
      h: g.h
    };
  }

  /* =========================================================
     HUD
     ========================================================= */
  function comboMult() {
    return 1 + Math.min(4, Math.floor(S.combo / 2));
  }

  function updateHud() {
    scoreEl.textContent = String(S.score);
    bestEl.textContent = String(S.best);
    stageNumEl.textContent = S.stage + '/' + MAX_STAGE;

    var hearts = '';
    for (var i = 0; i < 3; i++) {
      hearts += '<span class="h' + (i < S.lives ? '' : ' off') + '">' + (i < S.lives ? '♥' : '♡') + '</span>';
    }
    livesEl.innerHTML = hearts;

    btnSound.textContent = Sfx.enabled ? '🔊' : '🔇';
    btnSound.setAttribute('aria-label', Sfx.enabled ? '소리 끄기' : '소리 켜기');
    btnSound.setAttribute('title', Sfx.enabled ? '소리 끄기' : '소리 켜기');

    updateHudLive(true);
  }

  function activeItem() {
    var w = S.weapon;
    if (w.type && w.remaining > 0) return { type: w.type, left: w.remaining, total: w.total };
    if (S.wide > 0) return { type: 'wide', left: S.wide, total: ITEMS.wide.duration };
    if (S.shield > 0) return { type: 'shield', left: S.shield, total: ITEMS.shield.duration };
    return null;
  }

  var lastItemText = '';
  function updateHudLive(force) {
    comboEl.textContent = 'x' + comboMult();
    if (S.combo >= 2) comboEl.classList.add('hot');
    else comboEl.classList.remove('hot');

    var act = activeItem();
    if (act) {
      var left = Math.max(0, act.left);
      var pct = act.total > 0 ? Math.max(0, Math.min(100, (left / act.total) * 100)) : 0;
      var txt = ITEMS[act.type].label + ' ' + left.toFixed(1) + 's';
      itemCellEl.classList.add('on');
      if (act.type === 'bullet' || act.type === 'fire' || act.type === 'multi') itemCellEl.classList.remove('laser');
      else itemCellEl.classList.add('laser');
      if (force || txt !== lastItemText) {
        itemNameEl.textContent = txt;
        lastItemText = txt;
      }
      itemBarEl.style.width = pct.toFixed(1) + '%';
    } else {
      if (itemCellEl.classList.contains('on')) {
        itemCellEl.classList.remove('on');
        itemCellEl.classList.remove('laser');
      }
      if (force || lastItemText !== '없음') {
        itemNameEl.textContent = '없음';
        lastItemText = '없음';
      }
      itemBarEl.style.width = '0%';
    }
  }

  function addScore(n) {
    S.score += n;
    updateHud();
    scoreEl.classList.remove('pop');
    void scoreEl.offsetWidth;
    scoreEl.classList.add('pop');
  }

  /* =========================================================
     효과 (파편 / 스파크 / 점수 표시 / 흔들림)
     ========================================================= */
  function spawnParticles(x, y, color, count, opt) {
    if (S.particles.length > 200) return;
    var n = count || 10;
    var speed = (opt && opt.speed) || 200;
    var dir = (opt && opt.dir !== undefined) ? opt.dir : null;
    for (var i = 0; i < n; i++) {
      var a = dir === null ? Math.random() * Math.PI * 2
                           : (dir + (Math.random() - 0.5) * 0.9);
      var sp = speed * (0.35 + Math.random() * 1.1);
      S.particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 30,
        life: 0.35 + Math.random() * 0.4,
        max: 0.75,
        size: 1.6 + Math.random() * 3,
        color: color
      });
    }
  }

  // 바늘 모양 스파크 (충격 순간)
  function spawnSparks(x, y, color, count, dir) {
    if (S.particles.length > 220) return;
    for (var i = 0; i < count; i++) {
      var a = (dir === undefined ? -Math.PI / 2 : dir) + (Math.random() - 0.5) * 1.5;
      var sp = 180 + Math.random() * 380;
      S.particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 0.18 + Math.random() * 0.22,
        max: 0.4,
        size: 1.4 + Math.random() * 1.8,
        color: color,
        spark: true
      });
    }
  }

  function spawnFloater(x, y, text, color, size, kind) {
    S.floaters.push({
      x: x, y: y, text: text, color: color || '#fff',
      size: size || 15, life: 0.9, max: 0.9, kind: kind || 'score'
    });
  }

  /* =========================================================
     아이템 / 무기
     ========================================================= */
  function dropCapsule(br) {
    var r = brickRect(br);
    S.capsules.push({
      x: r.x + r.w / 2,
      y: r.y + r.h / 2,
      vy: 130 + Math.random() * 40,
      type: br.item,
      t: 0
    });
    Sfx.capsule();
  }

  function equip(type) {
    var def = ITEMS[type];
    if (!def) return;

    if (type === 'fire' || type === 'water') {
      var fam = (type === 'fire') ? 'red' : 'blue';
      S.waves.push({ type: type, t: 0, life: 1.15 });
      S.shake = Math.max(S.shake, 0.5);
      spawnFloater(S.W / 2, S.H * 0.5, def.label + ' 웨이브!', def.color, 24, 'item');
      if (type === 'fire') Sfx.fire(); else Sfx.water();
      destroyFamily(fam, type);
    } else if (type === 'multi') {
      multiBall();
    } else if (type === 'wide') {
      S.wide = def.duration;
      computeGeometry();
      clampPaddle();
      if (S.ball.stuck) stickBall();
      spawnFloater(S.W / 2, S.H * 0.58, def.label + ' 장착!', def.color, 22, 'item');
      spawnParticles(S.paddle.x, S.paddle.y, def.color, 16, { speed: 200 });
      Sfx.power();
    } else if (type === 'shield') {
      S.shield = def.duration;
      spawnFloater(S.W / 2, S.H * 0.58, def.label + ' 장착!', def.color, 22, 'item');
      spawnParticles(S.paddle.x, S.H - 8, def.color, 20, { speed: 180, dir: -Math.PI / 2 });
      Sfx.power();
    } else {
      S.weapon = { type: type, remaining: def.duration, total: def.duration, fireIn: 0.12 };
      spawnFloater(S.W / 2, S.H * 0.58, def.label + ' 장착!', def.color, 22, 'item');
      spawnParticles(S.paddle.x, S.paddle.y, def.color, 16, { speed: 180 });
      Sfx.equip();
    }

    updateHud();
    if (navigator.vibrate) { try { navigator.vibrate([10, 30, 12]); } catch (e) { /* 무시 */ } }
  }

  // 불·물 웨이브: 해당 계통(붉은/파란) 벽돌만 골라 부순다
  function destroyFamily(fam, type) {
    var list = [];
    for (var i = 0; i < S.bricks.length; i++) {
      var br = S.bricks[i];
      if (br.alive && br.fam === fam) list.push(br);
    }
    list.sort(function (a, b) { return (a.col - b.col) || (a.row - b.row); });

    for (var k = 0; k < list.length; k++) {
      var b = list[k];
      if (!b.alive) continue;
      var r = brickRect(b);
      var cx = r.x + r.w / 2, cy = r.y + r.h / 2;
      if (type === 'fire') {
        spawnParticles(cx, cy, '#ff8a3d', 10, { speed: 260 });
        spawnParticles(cx, cy, '#ffd166', 4, { speed: 190 });
        spawnSparks(cx, cy, '#fff0c0', 5);
      } else {
        spawnParticles(cx, cy, '#43b6ff', 10, { speed: 230 });
        spawnParticles(cx, cy, '#d6f2ff', 5, { speed: 170 });
        spawnSparks(cx, cy, '#eaf9ff', 4);
      }
      damageBrick(b, b.hp + 1, type);
      if (S.state !== 'play' && S.state !== 'ready') break;
    }
    return list.length;
  }

  function multiBall() {
    var b = S.ball;
    if (b.stuck && S.state === 'ready') launch();
    var sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy) || S.speed;
    var base = (b.vx === 0 && b.vy === 0) ? -Math.PI / 2 : Math.atan2(b.vy, b.vx);
    var angles = [base - 0.55, base + 0.55];
    for (var i = 0; i < angles.length; i++) {
      S.extraBalls.push({
        x: b.x, y: b.y,
        vx: Math.cos(angles[i]) * sp,
        vy: Math.sin(angles[i]) * sp,
        r: b.r, stuck: false, saved: false, trail: [], t: 0
      });
    }
    b.saved = false;
    spawnFloater(S.W / 2, S.H * 0.58, '멀티볼 x3!', ITEMS.multi.color, 24, 'item');
    spawnParticles(b.x, b.y, ITEMS.multi.color, 18, { speed: 220 });
    Sfx.multi();
  }

  function fireBullet() {
    var p = S.paddle;
    var off = p.w * 0.32;
    var xs = [p.x - off, p.x + off];
    for (var i = 0; i < xs.length; i++) {
      S.bullets.push({ x: xs[i], y: p.y - 6, vy: -860, dmg: 1, life: 2.4 });
      spawnSparks(xs[i], p.y - 4, '#ffe9a8', 3, -Math.PI / 2);
    }
    Sfx.shoot();
  }

  function fireLaser() {
    var p = S.paddle;
    var halfW = Math.max(5, S.W * 0.011);
    S.beams.push({ x: p.x, t: 0, life: 0.34, halfW: halfW });
    spawnSparks(p.x, p.y - 2, '#c8feff', 7, -Math.PI / 2);

    // 관통: 같은 세로줄의 벽돌을 모두 태운다
    var hit = 0;
    for (var i = 0; i < S.bricks.length; i++) {
      var br = S.bricks[i];
      if (!br.alive) continue;
      var r = brickRect(br);
      if (p.x >= r.x - halfW && p.x <= r.x + r.w + halfW) {
        var rr = brickRect(br);
        spawnSparks(Math.max(rr.x + 4, Math.min(p.x, rr.x + rr.w - 4)), rr.y + rr.h / 2, '#a9f7ff', 5, -Math.PI / 2);
        damageBrick(br, 2, 'laser');
        hit++;
        if (S.state !== 'play') return;
      }
    }
    if (hit === 0) spawnSparks(p.x, 6, '#7cf6ff', 3, -Math.PI / 2);
    Sfx.laser();
    if (navigator.vibrate) { try { navigator.vibrate(6); } catch (e) { /* 무시 */ } }
  }

  function updateWeapon(dt) {
    var w = S.weapon;
    if (!w.type) return;
    if (S.state !== 'play') return;      // 대기·일시정지 중에는 남은 시간이 줄지 않는다
    w.remaining -= dt;
    if (w.remaining <= 0) {
      S.weapon = { type: null, remaining: 0, total: 0, fireIn: 0 };
      updateHud();
      return;
    }
    w.fireIn -= dt;
    if (w.fireIn <= 0) {
      if (w.type === 'bullet') fireBullet();
      else fireLaser();
      w.fireIn = ITEMS[w.type].interval;
    }
  }

  function updateBullets(dt) {
    for (var i = S.bullets.length - 1; i >= 0; i--) {
      var bl = S.bullets[i];
      bl.y += bl.vy * dt;
      bl.life -= dt;
      if (bl.life <= 0 || bl.y < -12) { S.bullets.splice(i, 1); continue; }

      var hitBrick = null;
      for (var k = 0; k < S.bricks.length; k++) {
        var br = S.bricks[k];
        if (!br.alive) continue;
        var r = brickRect(br);
        if (bl.x >= r.x && bl.x <= r.x + r.w && bl.y >= r.y && bl.y <= r.y + r.h) {
          hitBrick = br;
          break;
        }
      }
      if (hitBrick) {
        var rr = brickRect(hitBrick);
        spawnSparks(bl.x, rr.y + rr.h, '#ffe08a', 5, -Math.PI / 2);
        damageBrick(hitBrick, bl.dmg, 'bullet');
        S.bullets.splice(i, 1);
        if (S.state !== 'play') return;
      }
    }
  }

  function updateCapsules(dt) {
    var p = S.paddle;
    for (var i = S.capsules.length - 1; i >= 0; i--) {
      var c = S.capsules[i];
      c.t += dt;
      c.y += c.vy * dt;
      var cw = capsuleW(), ch = capsuleH();
      var caught = (c.y + ch / 2) >= p.y && (c.y - ch / 2) <= p.y + p.h + 4 &&
                   c.x >= p.x - p.w / 2 - cw / 2 && c.x <= p.x + p.w / 2 + cw / 2;
      if (caught) {
        equip(c.type);
        S.capsules.splice(i, 1);
        continue;
      }
      if (c.y - ch > S.H) {
        spawnParticles(c.x, S.H - 4, ITEMS[c.type].color, 6, { speed: 120 });
        S.capsules.splice(i, 1);
      }
    }
  }

  function capsuleW() { return Math.max(34, Math.min(48, S.W * 0.1)); }
  function capsuleH() { return Math.max(18, Math.min(24, S.W * 0.05)); }

  /* =========================================================
     게임 흐름
     ========================================================= */
  function resetEffectsAndBalls() {
    S.weapon = { type: null, remaining: 0, total: 0, fireIn: 0 };
    S.wide = 0;
    S.shield = 0;
    S.waves = [];
    S.extraBalls = [];
  }

  function startGame() {
    Sfx.resume();
    S.score = 0;
    S.lives = 3;
    S.stage = 1;
    S.combo = 0;
    S.bestCombo = 0;
    S.broken = 0;
    S.particles = [];
    S.floaters = [];
    S.bullets = [];
    S.beams = [];
    S.capsules = [];
    resetEffectsAndBalls();
    var g1 = gridForStage(S.stage, S.W, S.H);
    S.cols = g1.cols;
    S.rows = g1.rows;
    computeGeometry();
    buildBricks(S.stage);
    resetBall();
    S.state = 'ready';
    hideOverlay();
    updateHud();
    Sfx.tone(523, 0.1, 'triangle', 784, 0.3);
  }

  function nextStage() {
    Sfx.resume();
    S.stage += 1;
    var g2 = gridForStage(S.stage, S.W, S.H);
    S.cols = g2.cols;
    S.rows = g2.rows;
    computeGeometry();
    buildBricks(S.stage);
    S.combo = 0;
    S.particles = [];
    S.floaters = [];
    S.bullets = [];
    S.beams = [];
    S.capsules = [];
    resetEffectsAndBalls();
    resetBall();
    S.state = 'ready';
    hideOverlay();
    updateHud();
    Sfx.tone(660, 0.12, 'triangle', 990, 0.32);
  }

  function resetBall() {
    var p = S.paddle;
    var b = S.ball;
    b.vx = 0; b.vy = 0;
    b.stuck = true;
    b.saved = false;
    b.trail = [];
    b.x = p.x;
    b.y = p.y - b.r - 2;
    S.extraBalls = [];
    S.sinceBrick = 0;
    S.paddle.target = null;
  }

  function stickBall() {
    var b = S.ball, p = S.paddle;
    b.x = Math.max(b.r, Math.min(S.W - b.r, p.x));
    b.y = p.y - b.r - 2;
    b.trail = [];
  }

  function launch() {
    if (S.state !== 'ready') return;
    var b = S.ball;
    var ang = (Math.random() * 2 - 1) * 0.34;
    b.vx = Math.sin(ang) * S.speed;
    b.vy = -Math.cos(ang) * S.speed;
    b.stuck = false;
    S.state = 'play';
    Sfx.launch();
    hideOverlay();
  }

  function loseLife() {
    S.lives -= 1;
    S.combo = 0;
    S.shake = 1;
    S.capsules = [];
    S.extraBalls = [];
    Sfx.lose();
    spawnParticles(S.ball.x, S.H - 6, '#ff6b81', 16);
    if (S.lives <= 0) {
      S.lives = 0;
      updateHud();
      gameOver();
      return;
    }
    updateHud();
    resetBall();
    S.state = 'ready';
  }

  function gameOver() {
    S.state = 'over';
    saveBest();
    Sfx.over();
    showOverlay('over');
  }

  function stageClear() {
    Sfx.clear();
    S.bullets = [];
    S.beams = [];
    S.capsules = [];
    if (S.stage >= MAX_STAGE) {
      S.state = 'win';
      saveBest();
      showOverlay('win');
    } else {
      S.state = 'clear';
      showOverlay('clear');
    }
  }

  function saveBest() {
    if (S.score > S.best) {
      S.best = S.score;
      storeSet(STORE_BEST, S.best);
    }
    updateHud();
  }

  function togglePause() {
    if (S.state === 'play' || S.state === 'ready') {
      S.prevState = S.state;
      S.state = 'pause';
      showOverlay('pause');
    } else if (S.state === 'pause') {
      S.state = S.prevState || 'play';
      hideOverlay();
    }
  }

  function restart() {
    startGame();
  }

  /* =========================================================
     오버레이
     ========================================================= */
  var shareable = (typeof navigator !== 'undefined' && !!navigator.share);
  var PAGE_URL = 'https://rok0083.github.io/air2air/samsung-high-brick-breaker/';

  function boardRows(rows) {
    var html = '<div class="board">';
    for (var i = 0; i < rows.length; i++) {
      html += '<div class="row' + (rows[i].hl ? ' hl' : '') + '">' +
                '<span>' + rows[i].k + '</span><b>' + rows[i].v + '</b>' +
              '</div>';
    }
    return html + '</div>';
  }

  /* =========================================================
     축하 연출 (색종이 + 불꽃놀이, 클리어 화면 전용)
     ========================================================= */
  var FX = {
    raf: 0, cv: null, cx: null, w: 0, h: 0, dpr: 1,
    t: 0, last: 0, spawn: 0, conf: [], spark: [], bursts: []
  };
  var FX_COLORS = ['#ffd76e', '#ff8fb1', '#7cf6ff', '#8ef2b6', '#ffffff', '#ffb347', '#c9adff'];

  function fxSize() {
    if (!FX.cv || !FX.cx) return;
    var r = FX.cv.getBoundingClientRect();
    FX.w = Math.max(1, Math.round(r.width));
    FX.h = Math.max(1, Math.round(r.height));
    FX.dpr = Math.min(window.devicePixelRatio || 1, 2);
    FX.cv.width = Math.round(FX.w * FX.dpr);
    FX.cv.height = Math.round(FX.h * FX.dpr);
    FX.cx.setTransform(FX.dpr, 0, 0, FX.dpr, 0, 0);
  }

  function spawnConfetti(n) {
    for (var i = 0; i < n; i++) {
      FX.conf.push({
        x: Math.random() * FX.w,
        y: -14 - Math.random() * 40,
        vx: (Math.random() - 0.5) * 70,
        vy: 70 + Math.random() * 130,
        w: 4 + Math.random() * 6,
        h: 7 + Math.random() * 8,
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 9,
        sway: 14 + Math.random() * 26,
        ph: Math.random() * 6.28,
        c: FX_COLORS[(Math.random() * FX_COLORS.length) | 0]
      });
    }
  }

  function spawnBurst() {
    var cx = FX.w * (0.18 + Math.random() * 0.64);
    var cy = FX.h * (0.12 + Math.random() * 0.3);
    var color = FX_COLORS[(Math.random() * FX_COLORS.length) | 0];
    var n = 24 + ((Math.random() * 12) | 0);
    for (var i = 0; i < n; i++) {
      var a = (i / n) * Math.PI * 2 + Math.random() * 0.2;
      var sp = 90 + Math.random() * 180;
      FX.spark.push({
        x: cx, y: cy,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 0.9 + Math.random() * 0.5,
        max: 1.4,
        c: Math.random() < 0.72 ? color : '#ffffff',
        r: 1.4 + Math.random() * 1.6
      });
    }
    Sfx.tone(1000 + Math.random() * 500, 0.14, 'triangle', 240, 0.10);
  }

  function fxFrame(now) {
    if (!FX.cx) return;
    FX.raf = window.requestAnimationFrame(fxFrame);
    var dt = FX.last ? Math.min(0.05, (now - FX.last) / 1000) : 1 / 60;
    FX.last = now;
    FX.t += dt;

    if (FX.t < 5.5) {
      FX.spawn += dt * (FX.t < 2.4 ? 130 : 42);
      var n = Math.min(6, Math.floor(FX.spawn));
      if (n > 0) { FX.spawn -= n; spawnConfetti(n); }
    }
    for (var bi = 0; bi < FX.bursts.length; bi++) {
      if (!FX.bursts[bi].done && FX.t >= FX.bursts[bi].at) {
        FX.bursts[bi].done = true;
        spawnBurst();
      }
    }

    var c = FX.cx;
    c.clearRect(0, 0, FX.w, FX.h);

    // 색종이
    for (var i = FX.conf.length - 1; i >= 0; i--) {
      var p = FX.conf[i];
      p.x += (p.vx + Math.sin(FX.t * 2.4 + p.ph) * p.sway) * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
      if (p.y > FX.h + 30 || p.x < -40 || p.x > FX.w + 40) { FX.conf.splice(i, 1); continue; }
      c.save();
      c.translate(p.x, p.y);
      c.rotate(p.rot);
      c.globalAlpha = 0.92;
      c.fillStyle = p.c;
      c.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.max(0.25, Math.abs(Math.cos(p.rot * 1.7))));
      c.restore();
    }

    // 불꽃
    for (var j = FX.spark.length - 1; j >= 0; j--) {
      var s = FX.spark[j];
      s.life -= dt;
      if (s.life <= 0) { FX.spark.splice(j, 1); continue; }
      s.vy += 210 * dt;
      s.vx *= (1 - 1.1 * dt);
      s.vy *= (1 - 1.1 * dt);
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      c.globalAlpha = Math.max(0, Math.min(1, s.life / s.max)) * 0.95;
      c.fillStyle = s.c;
      c.beginPath();
      c.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      c.fill();
    }
    c.globalAlpha = 1;

    if (FX.t > 11 && FX.conf.length === 0 && FX.spark.length === 0) stopFx();
  }

  function startFx() {
    stopFx();
    var cv = overlayEl.querySelector('.fx-canvas');
    if (!cv) return;
    FX.cv = cv;
    FX.cx = cv.getContext('2d');
    if (!FX.cx) { FX.cv = null; return; }
    fxSize();
    FX.t = 0;
    FX.last = 0;
    FX.spawn = 0;
    FX.conf = [];
    FX.spark = [];
    FX.bursts = [{ at: 0.15, done: false }, { at: 0.85, done: false }, { at: 1.6, done: false }];
    FX.raf = window.requestAnimationFrame(fxFrame);
  }

  function stopFx() {
    if (FX.raf) window.cancelAnimationFrame(FX.raf);
    FX.raf = 0;
    if (FX.cx) FX.cx.clearRect(0, 0, FX.w, FX.h);
    FX.cv = null;
    FX.cx = null;
    FX.conf = [];
    FX.spark = [];
    FX.bursts = [];
  }

  /* 스테이지 클리어/올클리어: 사진을 크게 띄우고 스코어는 아래 유리 카드로 */
  function statChips(rows) {
    var h = '<div class="statbar">';
    for (var i = 0; i < rows.length; i++) {
      h += '<span class="stat' + (rows[i].hl ? ' hl' : '') + '">' +
             '<i>' + rows[i].k + '</i><b>' + rows[i].v + '</b>' +
           '</span>';
    }
    return h + '</div>';
  }

  function photoOverlay(o) {
    var url = o.photo;
    return '<div class="photo-stage">' +

  function comboMultAt(n) {

  var toastTimer = 0;

  function shareUrl() {
    var h = location.href || '';
    if (!h || h.indexOf('file:') === 0 || h.indexOf('htmlpreview') >= 0 || h.indexOf('githack') >= 0) {

    }

  function copyLink() {
    var url = shareUrl();
    function legacy() {
      var ok = false;
      try {
        var ta = document.createElement('textarea');
        ta.value = url;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-1000px';
        ta.style.left = '0';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, url.length);
        ok = document.execCommand('copy');
        document.body.removeChild(ta);
      } catch (e) { ok = false; }
      showToast(ok ? '링크를 복사했어요. 카톡에 붙여넣기 하세요!' : '주소창의 주소를 복사해 주세요');
    }

      navigator.clipboard.writeText(url).then(function () {
        showToast('링크를 복사했어요. 카톡에 붙여넣기 하세요!');
      }, legacy);
    } else {
      legacy();

  function shareLink() {
    var data = {
      title: '삼성고동문회 벽돌깨기',
