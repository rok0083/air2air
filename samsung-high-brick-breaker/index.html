  /* =========================================================
     입력
     ========================================================= */
  function pointerX(e) {
    var rect = canvas.getBoundingClientRect();
    return e.clientX - rect.left;
  }

  function onPointerDown(e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (S.paddle.drag && e.isPrimary === false) return;
    Sfx.resume();
    if (S.state === 'ready') launch();
    if (S.state !== 'play' && S.state !== 'ready') return;

    var px = pointerX(e);
    S.paddle.drag = { startX: px, baseX: S.paddle.x };
    S.paddle.target = S.paddle.x;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* 무시 */ }
    e.preventDefault();
  }

  function onPointerMove(e) {
    if (!S.paddle.drag) return;
    if (S.state !== 'play' && S.state !== 'ready') return;
    var px = pointerX(e);
    var nx = S.paddle.drag.baseX + (px - S.paddle.drag.startX);
    S.paddle.target = Math.max(S.paddle.w / 2, Math.min(S.W - S.paddle.w / 2, nx));
    e.preventDefault();
  }

  function onPointerUp(e) {
    S.paddle.drag = null;
    try { canvas.releasePointerCapture(e.pointerId); } catch (err) { /* 무시 */ }
  }

  function onKeyDown(e) {
    var k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') { S.keys.left = true; e.preventDefault(); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { S.keys.right = true; e.preventDefault(); }
    else if (k === ' ' || k === 'Enter') {
      Sfx.resume();
      if (S.state === 'ready') launch();
      else if (S.state === 'start') startGame();
      else if (S.state === 'clear') nextStage();
      else if (S.state === 'over' || S.state === 'win') startGame();
      e.preventDefault();
    } else if (k === 'p' || k === 'P' || k === 'Escape') {
      togglePause();
      e.preventDefault();
    }
  }

  function onKeyUp(e) {
    var k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') S.keys.left = false;
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') S.keys.right = false;
  }

  /* =========================================================
     물리 업데이트
     ========================================================= */
  function updatePaddle(dt) {
    var p = S.paddle;
    if (S.keys.left && !S.keys.right) {
      p.x -= 820 * dt;
      p.target = p.x;
    } else if (S.keys.right && !S.keys.left) {
      p.x += 820 * dt;
      p.target = p.x;
    } else if (p.target !== null) {
      var a = 1 - Math.exp(-dt * 24);
      p.x += (p.target - p.x) * a;
      if (Math.abs(p.target - p.x) < 0.4) p.x = p.target;
    }
    clampPaddle();
  }

  function fixBallAngle(b) {
    b = b || S.ball;
    var sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy) || S.speed;
    var minX = sp * 0.22;
    var minY = sp * 0.32;
    if (Math.abs(b.vx) < minX) b.vx = (b.vx < 0 ? -1 : 1) * minX;
    if (Math.abs(b.vy) < minY) b.vy = (b.vy < 0 ? -1 : 1) * minY;
    var m = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
    if (m > 0) {
      b.vx = b.vx / m * sp;
      b.vy = b.vy / m * sp;
    }
  }

  function steerToBricks() {
    var b = S.ball;
    var best = null, bestD = 1e9;
    for (var i = 0; i < S.bricks.length; i++) {
      var br = S.bricks[i];
      if (!br.alive) continue;
      var r = brickRect(br);
      var cx = r.x + r.w / 2, cy = r.y + r.h / 2;
      var d = Math.abs(cx - b.x) + Math.abs(cy - b.y) * 0.35;
      if (d < bestD) { bestD = d; best = { x: cx, y: cy }; }
    }
    if (!best) return;
    var sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy) || S.speed;
    var dir = best.x >= b.x ? 1 : -1;
    if (Math.abs(b.vx) < sp * 0.42) {
      b.vx = dir * sp * 0.42;
    } else if (b.vx * dir < 0) {
      b.vx = -b.vx;
    }
    fixBallAngle();
  }

  function collidePaddle(b) {
    var p = S.paddle;
    if (b.vy <= 0) return;

    var cx = Math.max(p.x - p.w / 2, Math.min(b.x, p.x + p.w / 2));
    var cy = Math.max(p.y, Math.min(b.y, p.y + p.h));
    var dx = b.x - cx, dy = b.y - cy;
    if (dx * dx + dy * dy > b.r * b.r) return;

    var off = (b.x - p.x) / (p.w / 2);
    off = Math.max(-1, Math.min(1, off));
    var angle = off * (Math.PI / 3);
    var sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy) || S.speed;
    sp = Math.min(S.speed * 1.35, sp * 1.006 + 1);
    b.vx = Math.sin(angle) * sp;
    b.vy = -Math.cos(angle) * sp;
    b.y = p.y - b.r - 0.6;
    b.saved = false;
    fixBallAngle(b);

    if (S.combo > S.bestCombo) S.bestCombo = S.combo;
    S.combo = 0;
    updateHudLive();
    spawnSparks(b.x, p.y, '#bff0ff', 3, -Math.PI / 2);
    Sfx.paddle();
  }

  function damageBrick(br, dmg, source) {
    if (!br.alive) return false;
    br.hp -= (dmg || 1);
    br.flash = 1;
    S.sinceBrick = 0;

    var r1 = brickRect(br);
    var c1x = r1.x + r1.w / 2, c1y = r1.y + r1.h / 2;

    if (br.hp > 0) {
      S.combo += 1;
      Sfx.chip();
      spawnSparks(c1x, c1y, '#ffffff', 4);
      spawnParticles(c1x, c1y, br.top, 3, { speed: 110 });
      updateHudLive();
      return false;
    }

    br.alive = false;
    S.broken += 1;
    S.combo += 1;
    if (S.combo > S.bestCombo) S.bestCombo = S.combo;

    var mult = comboMult();
    var gain = Math.round((30 + (S.rows - br.row) * 10) * mult * (source === 'ball' ? 1 : 0.8));

    addScore(gain);

    spawnParticles(c1x, c1y, br.top, 12);
    spawnParticles(c1x, c1y, '#ffe08a', 4);
    spawnSparks(c1x, c1y, '#fff6cf', 5, -Math.PI / 2);
    spawnFloater(c1x, c1y, '+' + gain, mult > 1 ? '#ffe08a' : '#ffffff', mult > 1 ? 18 : 15, 'score');
    if (S.combo >= 4 && S.combo % 2 === 0) {
      spawnFloater(S.W / 2, S.H * 0.42, 'COMBO x' + mult + '!', '#ffd76e', 26, 'combo');
    }
    Sfx.brick(S.stage);
    if (navigator.vibrate) { try { navigator.vibrate(8); } catch (e) { /* 무시 */ } }

    if (br.item) dropCapsule(br);

    updateHudLive();
    checkStageClear();
    return true;
  }

  function collideBricks(b) {
    for (var i = 0; i < S.bricks.length; i++) {
      var br = S.bricks[i];
      if (!br.alive) continue;
      var r = brickRect(br);
      var cx = Math.max(r.x, Math.min(b.x, r.x + r.w));
      var cy = Math.max(r.y, Math.min(b.y, r.y + r.h));
      var dx = b.x - cx, dy = b.y - cy;
      var d2 = dx * dx + dy * dy;
      if (d2 > b.r * b.r) continue;

      var nx, ny;
      if (d2 > 0.000001) {
        var d = Math.sqrt(d2);
        nx = dx / d; ny = dy / d;
        var pen = b.r - d;
        b.x += nx * pen;
        b.y += ny * pen;
      } else {
        var left = b.x - r.x, right = (r.x + r.w) - b.x;
        var top = b.y - r.y, bottom = (r.y + r.h) - b.y;
        var m = Math.min(left, right, top, bottom);
        if (m === left) { nx = -1; ny = 0; b.x = r.x - b.r; }
        else if (m === right) { nx = 1; ny = 0; b.x = r.x + r.w + b.r; }
        else if (m === top) { nx = 0; ny = -1; b.y = r.y - b.r; }
        else { nx = 0; ny = 1; b.y = r.y + r.h + b.r; }
      }

      var dot = b.vx * nx + b.vy * ny;
      if (dot < 0) {
        b.vx -= 2 * dot * nx;
        b.vy -= 2 * dot * ny;
      }

      fixBallAngle(b);
      damageBrick(br, 1, 'ball');
      return;
    }
  }

  function checkStageClear() {
    for (var i = 0; i < S.bricks.length; i++) {
      if (S.bricks[i].alive) return;
    }
    if (S.state === 'play' || S.state === 'ready') stageClear();
  }

  // 공을 하나 잃었을 때 (실드 → 보조 공 → 생명 순으로 처리)
  function ballLost(b, primary) {
    if (S.shield > 0 && !b.saved) {
      b.saved = true;
      b.y = S.H - b.r - 14;
      b.vy = -Math.abs(b.vy || S.speed * 0.6);
      fixBallAngle(b);
      spawnParticles(b.x, S.H - 10, ITEMS.shield.color, 18, { speed: 210, dir: -Math.PI / 2 });
      spawnFloater(b.x, S.H - 46, '실드!', ITEMS.shield.color, 18, 'item');
      Sfx.bounce();
      return;
    }
    if (!primary) {
      var idx = S.extraBalls.indexOf(b);
      if (idx >= 0) S.extraBalls.splice(idx, 1);
      spawnParticles(b.x, S.H - 6, '#9fd0ff', 8, { speed: 150 });
      return;
    }
    if (S.extraBalls.length > 0) {
      var nb = S.extraBalls.shift();
      S.ball.x = nb.x; S.ball.y = nb.y;
      S.ball.vx = nb.vx; S.ball.vy = nb.vy;
      S.ball.trail = nb.trail || [];
      S.ball.stuck = false; S.ball.saved = false;
      Sfx.bounce();
      return;
    }
    loseLife();
  }

  function updateEffects(dt) {
    if (S.state !== 'play') return;
    if (S.wide > 0) {
      S.wide -= dt;
      if (S.wide <= 0) {
        S.wide = 0;
        computeGeometry();
        clampPaddle();
        if (S.ball.stuck) stickBall();
        updateHud();
      }
    }
    if (S.shield > 0) S.shield = Math.max(0, S.shield - dt);
  }

  function updateWaves(dt) {
    for (var i = S.waves.length - 1; i >= 0; i--) {
      S.waves[i].t += dt;
      if (S.waves[i].t >= S.waves[i].life) S.waves.splice(i, 1);
    }
  }

  function stepBall(b, dt, primary) {
    var W = S.W, H = S.H;
    var dist = Math.sqrt(b.vx * b.vx + b.vy * b.vy) * dt;
    var steps = Math.max(1, Math.min(8, Math.ceil(dist / 3)));
    var sdt = dt / steps;

    for (var i = 0; i < steps; i++) {
      b.x += b.vx * sdt;
      b.y += b.vy * sdt;

      if (b.x - b.r < 0) { b.x = b.r; b.vx = Math.abs(b.vx); Sfx.wall(); fixBallAngle(b); }
      else if (b.x + b.r > W) { b.x = W - b.r; b.vx = -Math.abs(b.vx); Sfx.wall(); fixBallAngle(b); }
      if (b.y - b.r < 0) { b.y = b.r; b.vy = Math.abs(b.vy); Sfx.wall(); }

      collidePaddle(b);
      collideBricks(b);
      if (S.state !== 'play') return;

      if (b.y - b.r > H) {
        ballLost(b, primary);
        return;
      }
    }

    b.trail.push({ x: b.x, y: b.y });
    if (b.trail.length > 10) b.trail.shift();
  }

  function updateParticles(dt) {
    for (var i = S.particles.length - 1; i >= 0; i--) {
      var p = S.particles[i];
      p.life -= dt;
      if (p.life <= 0) { S.particles.splice(i, 1); continue; }
      p.vy += (p.spark ? 420 : 620) * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= (1 - 1.2 * dt);
    }
  }

  function updateFloaters(dt) {
    for (var i = S.floaters.length - 1; i >= 0; i--) {
      var f = S.floaters[i];
      f.life -= dt;
      if (f.life <= 0) { S.floaters.splice(i, 1); continue; }
      f.y -= (f.kind === 'combo' ? 28 : 42) * dt;
    }
  }

  function updateBeams(dt) {
    for (var i = S.beams.length - 1; i >= 0; i--) {
      var bm = S.beams[i];
      bm.t += dt;
      if (bm.t >= bm.life) S.beams.splice(i, 1);
    }
  }

  function update(dt) {
    if (S.state !== 'pause') S.time += dt;
    if (S.state === 'ready' || S.state === 'play') updatePaddle(dt);
    if (S.state === 'ready') stickBall();
    if (S.state === 'play') {
      stepBall(S.ball, dt, true);
      for (var bi = S.extraBalls.length - 1; bi >= 0 && S.state === 'play'; bi--) {
        stepBall(S.extraBalls[bi], dt, false);
      }
      S.sinceBrick += dt;
      if (S.sinceBrick > 7) { S.sinceBrick = 0; steerToBricks(); }
      updateWeapon(dt);
      updateEffects(dt);
      updateWaves(dt);
      updateBullets(dt);
      updateBeams(dt);
    }
    updateCapsules(dt);
    updateParticles(dt);
    updateFloaters(dt);
    if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 2.2);
    for (var i = 0; i < S.bricks.length; i++) {
      if (S.bricks[i].flash > 0) S.bricks[i].flash = Math.max(0, S.bricks[i].flash - dt * 6);
    }
    if (S.state !== 'start') updateHudLive();
  }

  /* =========================================================
     그리기
     ========================================================= */
  function roundRect(c, x, y, w, h, r) {
    var rad = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + rad, y);
    c.lineTo(x + w - rad, y);
    c.arcTo(x + w, y, x + w, y + rad, rad);
    c.lineTo(x + w, y + h - rad);
    c.arcTo(x + w, y + h, x + w - rad, y + h, rad);
    c.lineTo(x + rad, y + h);
    c.arcTo(x, y + h, x, y + h - rad, rad);
    c.lineTo(x, y + rad);
    c.arcTo(x, y, x + rad, y, rad);
    c.closePath();
  }

  function makeStars() {
    var arr = [];
    for (var i = 0; i < 46; i++) {
      arr.push({
        x: Math.random(),
        y: Math.random(),
        r: 0.6 + Math.random() * 1.4,
        a: 0.12 + Math.random() * 0.4,
        s: 0.6 + Math.random() * 1.6
      });
    }
    S.stars = arr;
  }

  function drawBackground() {
    var W = S.W, H = S.H;
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0a1024');
    g.addColorStop(0.55, '#080c1a');
    g.addColorStop(1, '#05070f');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 게임 중: 지금 스테이지의 동문 사진을 은은하게 깔아 둔다 (벽돌·공·아이템은 또렷하게)
    if (S.state !== 'start') {
      var im = stagePhoto(S.stage);
      if (im && im.naturalWidth > 0) {
        var iw = im.naturalWidth, ih = im.naturalHeight;
        var sc = Math.max(W / iw, H / ih);
        var dw = iw * sc, dh = ih * sc;
        ctx.save();
        ctx.globalAlpha = 0.24;
        ctx.drawImage(im, (W - dw) / 2, (H - dh) / 2, dw, dh);
        ctx.restore();

        // 벽돌판 뒤는 살짝 눌러 두고 아래쪽은 어둡게 (사진은 은은하게, 글자는 선명하게)
        var dk = ctx.createLinearGradient(0, 0, 0, H);
        dk.addColorStop(0, 'rgba(6, 10, 22, 0.30)');
        dk.addColorStop(0.5, 'rgba(6, 10, 22, 0.10)');
        dk.addColorStop(1, 'rgba(6, 10, 22, 0.42)');
        ctx.fillStyle = dk;
        ctx.fillRect(0, 0, W, H);
      }
    }

    for (var i = 0; i < S.stars.length; i++) {
      var s = S.stars[i];
      var tw = 0.6 + 0.4 * Math.sin(S.time * s.s + i);
      ctx.globalAlpha = s.a * tw;
      ctx.fillStyle = '#9fc4ff';
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H * 0.92, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    var dg = ctx.createLinearGradient(0, H - 70, 0, H);
    dg.addColorStop(0, 'rgba(255,60,90,0)');
    dg.addColorStop(1, 'rgba(255,60,90,0.16)');
    ctx.fillStyle = dg;
    ctx.fillRect(0, H - 70, W, 70);
    ctx.fillStyle = 'rgba(255,90,120,0.35)';
    ctx.fillRect(0, H - 2, W, 2);
  }

  // 벽돌 위 아이템 아이콘 (벡터로 그린다 — 폰트/이모지 지원과 무관하게 또렷)
  function drawItemIcon(type, cx, cy, size, color) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = Math.max(1, size * 0.22);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if (type === 'bullet') {
      // 총알 모양
      ctx.beginPath();
      ctx.moveTo(cx, cy - size);
      ctx.lineTo(cx + size * 0.55, cy - size * 0.15);
      ctx.lineTo(cx + size * 0.55, cy + size * 0.9);
      ctx.lineTo(cx - size * 0.55, cy + size * 0.9);
      ctx.lineTo(cx - size * 0.55, cy - size * 0.15);
      ctx.closePath();
      ctx.fill();
    } else if (type === 'laser') {
      // 번개 모양 (레이저)
      ctx.beginPath();
      ctx.moveTo(cx + size * 0.2, cy - size);
      ctx.lineTo(cx - size * 0.55, cy + size * 0.15);
      ctx.lineTo(cx - size * 0.02, cy + size * 0.15);
      ctx.lineTo(cx - size * 0.2, cy + size);
      ctx.lineTo(cx + size * 0.6, cy - size * 0.2);
      ctx.lineTo(cx + size * 0.05, cy - size * 0.2);
      ctx.closePath();
      ctx.fill();
    } else if (type === 'fire') {
      // 불꽃
      ctx.beginPath();
      ctx.moveTo(cx, cy - size * 1.05);
      ctx.bezierCurveTo(cx + size * 0.9, cy - size * 0.15, cx + size * 0.62, cy + size * 0.95, cx, cy + size * 0.95);
      ctx.bezierCurveTo(cx - size * 0.62, cy + size * 0.95, cx - size * 0.9, cy - size * 0.15, cx, cy - size * 1.05);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = '#fff3cf';
      ctx.beginPath();
      ctx.moveTo(cx, cy - size * 0.15);
      ctx.bezierCurveTo(cx + size * 0.4, cy + size * 0.25, cx + size * 0.25, cy + size * 0.85, cx, cy + size * 0.85);
      ctx.bezierCurveTo(cx - size * 0.25, cy + size * 0.85, cx - size * 0.4, cy + size * 0.25, cx, cy - size * 0.15);
      ctx.fill();
    } else if (type === 'water') {
      // 물방울
      ctx.beginPath();
      ctx.moveTo(cx, cy - size);
      ctx.quadraticCurveTo(cx + size, cy + size * 0.18, cx, cy + size * 0.95);
      ctx.quadraticCurveTo(cx - size, cy + size * 0.18, cx, cy - size);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(cx - size * 0.28, cy + size * 0.25, size * 0.22, 0, Math.PI * 2);
      ctx.fill();
    } else if (type === 'multi') {
      // 공 3개
      var rr = size * 0.4;
      var pts = [[0, -size * 0.55], [-size * 0.62, size * 0.5], [size * 0.62, size * 0.5]];
      for (var q = 0; q < pts.length; q++) {
        ctx.beginPath();
        ctx.arc(cx + pts[q][0], cy + pts[q][1], rr, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (type === 'wide') {
      // 넓은 패들 + 양쪽 화살표
      roundRect(ctx, cx - size, cy - size * 0.1, size * 2, size * 0.42, size * 0.2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(cx - size * 1.3, cy - size * 0.75);
      ctx.lineTo(cx - size * 0.75, cy - size * 0.45);
      ctx.lineTo(cx - size * 1.3, cy - size * 0.15);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(cx + size * 1.3, cy - size * 0.75);
      ctx.lineTo(cx + size * 0.75, cy - size * 0.45);
      ctx.lineTo(cx + size * 1.3, cy - size * 0.15);
      ctx.closePath();
      ctx.fill();
    } else {
      // 실드
      ctx.beginPath();
      ctx.moveTo(cx, cy - size);
      ctx.lineTo(cx + size * 0.85, cy - size * 0.5);
      ctx.lineTo(cx + size * 0.85, cy + size * 0.25);
      ctx.quadraticCurveTo(cx + size * 0.8, cy + size * 0.95, cx, cy + size);
      ctx.quadraticCurveTo(cx - size * 0.8, cy + size * 0.95, cx - size * 0.85, cy + size * 0.25);
      ctx.lineTo(cx - size * 0.85, cy - size * 0.5);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  function drawBricks() {
    var g = S.geo;
    var fontSize = Math.round(g.font * 10) / 10;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    for (var i = 0; i < S.bricks.length; i++) {
      var b = S.bricks[i];
      if (!b.alive) continue;
      var r = brickRect(b);
      var dmg = 1 - (b.hp / b.maxHp);
      var rad = Math.min(6, g.h * 0.2);

      // 그림자
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      roundRect(ctx, r.x + 1, r.y + 2.5, r.w, r.h, rad);
      ctx.fill();

      // 몸통
      var lg = ctx.createLinearGradient(r.x, r.y, r.x, r.y + r.h);
      lg.addColorStop(0, b.top);
      lg.addColorStop(1, b.bottom);
      roundRect(ctx, r.x, r.y, r.w, r.h, rad);
      ctx.fillStyle = lg;
      ctx.fill();

      // 윗면 하이라이트
      ctx.save();
      roundRect(ctx, r.x, r.y, r.w, r.h, rad);
      ctx.clip();
      ctx.fillStyle = 'rgba(255,255,255,0.22)';
      ctx.fillRect(r.x, r.y, r.w, Math.max(2, r.h * 0.15));
      ctx.restore();

      // 단단한 벽돌 테두리
      if (b.maxHp >= 2) {
        ctx.strokeStyle = 'rgba(255,255,255,' + (0.5 - dmg * 0.22) + ')';
        ctx.lineWidth = 1.4;
        roundRect(ctx, r.x + 2, r.y + 2, r.w - 4, r.h - 4, Math.max(3, rad - 2));
        ctx.stroke();
      }

      // 손상 균열
      if (dmg > 0) {
        ctx.save();
        roundRect(ctx, r.x, r.y, r.w, r.h, rad);
        ctx.clip();
        ctx.fillStyle = 'rgba(0,0,0,' + (0.18 * dmg) + ')';
        ctx.fillRect(r.x, r.y, r.w, r.h);
        ctx.strokeStyle = 'rgba(0,0,0,0.45)';
        ctx.lineWidth = 1.2;
        var s1 = (b.seed % 7) / 7;
        ctx.beginPath();
        ctx.moveTo(r.x + r.w * (0.2 + s1 * 0.4), r.y + 1);
        ctx.lineTo(r.x + r.w * (0.35 + s1 * 0.3), r.y + r.h * 0.5);
        ctx.lineTo(r.x + r.w * (0.22 + s1 * 0.35), r.y + r.h - 1);
        ctx.stroke();
        ctx.restore();
      }

      // 아이템 벽돌: 빛나는 테두리 + 아이콘 배지
      if (b.item) {
        var def = ITEMS[b.item];
        var pulse = 0.55 + 0.45 * Math.sin(S.time * 6 + b.seed * 0.3);
        ctx.save();
        ctx.shadowColor = def.color;
        ctx.shadowBlur = 8 + 9 * pulse;
        ctx.strokeStyle = def.color;
        ctx.lineWidth = 2;
        roundRect(ctx, r.x + 0.8, r.y + 0.8, r.w - 1.6, r.h - 1.6, rad);
        ctx.stroke();
        ctx.restore();

        var badgeR = Math.max(4.5, Math.min(8, Math.min(brickRect(b).w * 0.2, g.h * 0.3)));
        var bx = r.x + r.w - badgeR - 1.5;
        var by = r.y + badgeR + 1.5;
        ctx.save();
        ctx.globalAlpha = 0.96;
        ctx.shadowColor = def.color;
        ctx.shadowBlur = 7 + 4 * pulse;
        ctx.fillStyle = def.color;
        ctx.beginPath();
        ctx.arc(bx, by, badgeR, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(255,255,255,0.75)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(bx, by, badgeR, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
        drawItemIcon(b.item, bx, by, badgeR * 0.62, 'rgba(12,17,32,0.92)');
      }

      // 이름
      ctx.font = '800 ' + fontSize + 'px ' + FONT;
      var cx = r.x + r.w / 2;
      var cy = r.y + r.h / 2 + 0.4;
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillText(b.name, cx + 0.7, cy + 1.1);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(b.name, cx, cy);

      // 맞은 순간 번쩍
      if (b.flash > 0) {
        ctx.save();
        roundRect(ctx, r.x, r.y, r.w, r.h, rad);
        ctx.fillStyle = 'rgba(255,255,255,' + (0.45 * b.flash) + ')';
        ctx.fill();
        ctx.restore();
      }
    }
  }

  function drawCapsules() {
    var ch = capsuleH();
    for (var i = 0; i < S.capsules.length; i++) {
      var c = S.capsules[i];
      var def = ITEMS[c.type];
      var labelFont = Math.max(8, Math.round(ch * 0.44));
      ctx.font = '900 ' + labelFont + 'px ' + FONT;
      var tw = ctx.measureText(def.label).width;
      var cw = Math.min(80, Math.max(30, ch * 0.72 + tw + ch * 0.52));
      var wob = Math.sin(c.t * 7) * 2.2;
      var x = c.x - cw / 2 + wob;
      var y = c.y - ch / 2;

      ctx.save();
      ctx.shadowColor = def.color;
      ctx.shadowBlur = 16;
      var g = ctx.createLinearGradient(0, y, 0, y + ch);
      g.addColorStop(0, '#20283f');
      g.addColorStop(1, '#0b1020');
      roundRect(ctx, x, y, cw, ch, ch / 2);
      ctx.fillStyle = g;
      ctx.fill();
      ctx.strokeStyle = def.color;
      ctx.lineWidth = 1.6;
      roundRect(ctx, x, y, cw, ch, ch / 2);
      ctx.stroke();
      ctx.restore();

      drawItemIcon(c.type, x + ch * 0.5, y + ch / 2, ch * 0.3, def.color);

      ctx.font = '900 ' + labelFont + 'px ' + FONT;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = def.color;
      ctx.fillText(def.label, x + ch * 0.9, y + ch / 2 + 0.5);
      ctx.textAlign = 'center';
    }
  }

  function drawBullets() {
    for (var i = 0; i < S.bullets.length; i++) {
      var b = S.bullets[i];
      ctx.save();
      ctx.shadowColor = '#ffd45c';
      ctx.shadowBlur = 12;
      var g = ctx.createLinearGradient(0, b.y - 12, 0, b.y + 6);
      g.addColorStop(0, '#fff6d0');
      g.addColorStop(0.5, '#ffd45c');
      g.addColorStop(1, '#ff9d2e');
      ctx.fillStyle = g;
      roundRect(ctx, b.x - 2.2, b.y - 10, 4.4, 16, 2.2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawBeams() {
    for (var i = 0; i < S.beams.length; i++) {
      var bm = S.beams[i];
      var k = 1 - bm.t / bm.life;
      var alpha = Math.max(0, k);
      var top = 0;
      var bottom = S.paddle.y;
      var hw = bm.halfW * (0.5 + 0.5 * k);

      ctx.save();
      ctx.globalAlpha = alpha * 0.9;
      var g = ctx.createLinearGradient(0, top, 0, bottom);
      g.addColorStop(0, 'rgba(140,246,255,0.15)');
      g.addColorStop(0.6, 'rgba(140,246,255,0.7)');
      g.addColorStop(1, 'rgba(200,255,255,0.95)');
      ctx.shadowColor = '#7cf6ff';
      ctx.shadowBlur = 26;
      ctx.fillStyle = g;
      ctx.fillRect(bm.x - hw, top, hw * 2, bottom - top);

      ctx.shadowBlur = 12;
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.fillRect(bm.x - hw * 0.28, top, hw * 0.56, bottom - top);
      ctx.restore();
    }
  }

  function drawPaddle() {
    var p = S.paddle;
    var x = p.x - p.w / 2;
    var y = p.y;
    var wpn = S.weapon.type;

    ctx.save();
    if (wpn) {
      var def = ITEMS[wpn];
      ctx.shadowColor = def.color;
      ctx.shadowBlur = 20 + 6 * Math.sin(S.time * 8);
    } else {
      ctx.shadowColor = 'rgba(90,200,255,0.75)';
      ctx.shadowBlur = 15;
    }
    var g = ctx.createLinearGradient(0, y, 0, y + p.h);
    g.addColorStop(0, '#bff0ff');
    g.addColorStop(0.45, '#5fd0ff');
    g.addColorStop(1, '#1878c9');
    roundRect(ctx, x, y, p.w, p.h, p.h / 2);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.restore();

    // 무기 장착 표현
    if (wpn === 'bullet') {
      var off = p.w * 0.32;
      [-off, off].forEach(function (dx) {
        ctx.save();
        ctx.fillStyle = '#ffd45c';
        ctx.shadowColor = '#ffd45c';
        ctx.shadowBlur = 10;
        roundRect(ctx, p.x + dx - 2.5, y - 7, 5, 9, 2);
        ctx.fill();
        ctx.restore();
      });
    } else if (wpn === 'laser') {
      ctx.save();
      ctx.fillStyle = '#c8feff';
      ctx.shadowColor = '#7cf6ff';
      ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.arc(p.x, y - 4, 4 + Math.sin(S.time * 10) * 0.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // 가운데 마커
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.arc(p.x, y + p.h / 2, Math.max(1.5, p.h * 0.16), 0, Math.PI * 2);
    ctx.fill();
  }

  function drawBall(b, alt) {
    b = b || S.ball;
    // 잔상 (공 궤적)
    for (var i = 0; i < b.trail.length; i++) {
      var t = b.trail[i];
      var a = (i + 1) / b.trail.length;
      ctx.globalAlpha = a * 0.28;
      ctx.fillStyle = alt ? '#8fe8ff' : '#ffd166';
      ctx.beginPath();
      ctx.arc(t.x, t.y, b.r * (0.25 + 0.6 * a), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.save();
    ctx.shadowColor = alt ? 'rgba(120,220,255,0.9)' : 'rgba(255,200,80,0.9)';
    ctx.shadowBlur = 16;
    var g = ctx.createRadialGradient(b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.15, b.x, b.y, b.r * 1.05);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.55, alt ? '#c8f4ff' : '#ffe28a');
    g.addColorStop(1, alt ? '#3ab6ff' : '#ff9b3d');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // 바닥 실드 막
  function drawShield() {
    if (S.shield <= 0) return;
    var W = S.W, H = S.H;
    var y = H - 9;
    var pulse = 0.65 + 0.35 * Math.sin(S.time * 7);
    var fade = S.shield < 2 ? (S.shield / 2) : 1;
    ctx.save();
    ctx.globalAlpha = Math.max(0, fade);
    ctx.shadowColor = ITEMS.shield.color;
    ctx.shadowBlur = 20;
    var g = ctx.createLinearGradient(0, y - 14, 0, H);
    g.addColorStop(0, 'rgba(142,242,182,0)');
    g.addColorStop(0.55, 'rgba(142,242,182,' + (0.42 * pulse).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(220,255,235,0.92)');
    ctx.fillStyle = g;
    ctx.fillRect(0, y - 14, W, H - (y - 14));
    ctx.strokeStyle = 'rgba(235,255,245,' + (0.9 * pulse).toFixed(3) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (var x = 0; x <= W; x += 6) {
      var yy = y + Math.sin(x * 0.05 + S.time * 5) * 2.4;
      if (x === 0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
    }
    ctx.stroke();
    ctx.restore();
  }

  // 불·물 웨이브 (아래에서 위로 솟는 파도)
  function drawWaves() {
    for (var i = 0; i < S.waves.length; i++) {
      var wv = S.waves[i];
      var p = Math.min(1, wv.t / wv.life);
      var hot = wv.type === 'fire';
      var base = hot ? '255,130,50' : '70,175,255';
      var bright = hot ? '255,225,140' : '210,245,255';
      var top = S.H * (1 - p * 1.05);
      var alpha = Math.max(0, Math.sin(Math.PI * Math.min(1, p * 1.05)));

      ctx.save();
      ctx.globalAlpha = alpha * 0.6;
      var g = ctx.createLinearGradient(0, top - 100, 0, top + 26);
      g.addColorStop(0, 'rgba(' + base + ',0)');
      g.addColorStop(0.72, 'rgba(' + base + ',0.55)');
      g.addColorStop(1, 'rgba(' + bright + ',0.92)');
      ctx.fillStyle = g;
      ctx.fillRect(0, top - 100, S.W, 128);

      ctx.globalAlpha = alpha * 0.92;
      ctx.strokeStyle = 'rgba(' + bright + ',0.92)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      for (var x = 0; x <= S.W; x += 8) {
        var yy = top + Math.sin(x * 0.045 + wv.t * 12) * 9;
        if (x === 0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
      }
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawParticles() {
    for (var i = 0; i < S.particles.length; i++) {
      var p = S.particles[i];
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life / p.max));
      ctx.fillStyle = p.color;
      if (p.spark) {
        // 스파크: 진행 방향으로 늘어진 선
        var len = Math.min(9, Math.abs(p.vx) * 0.02 + Math.abs(p.vy) * 0.02 + 2);
        var ang = Math.atan2(p.vy, p.vx);
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(ang);
        ctx.fillRect(-len, -p.size / 2, len * 2, p.size);
        ctx.restore();
      } else {
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawFloaters() {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var i = 0; i < S.floaters.length; i++) {
      var f = S.floaters[i];
      var a = Math.max(0, Math.min(1, f.life / f.max));
      var grow = f.kind === 'combo' ? 1 + (1 - f.life / f.max) * 0.35 : 1;
      ctx.globalAlpha = a;
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.scale(grow, grow);
      ctx.font = '900 ' + Math.round(f.size) + 'px ' + FONT;
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillText(f.text, 1, 2);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, 0, 0);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function drawHints() {
    var b = S.ball, p = S.paddle;

    if (S.state === 'ready') {
      var pulse = 0.55 + 0.45 * Math.sin(S.time * 5);
      var ty = Math.max(26, p.y - 70);
      var tx = Math.max(64, Math.min(S.W - 64, b.x));
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.globalAlpha = pulse;
      ctx.font = '800 14px ' + FONT;
      ctx.fillStyle = '#ffe08a';
      ctx.fillText('탭하여 공 발사', tx, ty);
      ctx.globalAlpha = 1;

      ctx.globalAlpha = pulse * 0.8;
      ctx.strokeStyle = '#ffe08a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(tx, ty + 13);
      ctx.lineTo(tx, ty + 23);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(tx - 5, ty + 18);
      ctx.lineTo(tx, ty + 12);
      ctx.lineTo(tx + 5, ty + 18);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  function draw() {
    var W = S.W, H = S.H;
    ctx.setTransform(S.dpr, 0, 0, S.dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    ctx.save();
    if (S.shake > 0) {
      var sh = S.shake * 5;
      ctx.translate((Math.random() - 0.5) * sh, (Math.random() - 0.5) * sh);
    }

    drawBackground();
    drawBricks();
    drawWaves();
    drawCapsules();
    drawParticles();
    drawBeams();
    drawShield();
    drawPaddle();
    drawBullets();
    drawBall(S.ball, false);
    for (var ei = 0; ei < S.extraBalls.length; ei++) drawBall(S.extraBalls[ei], true);
    drawFloaters();
    drawHints();

    ctx.restore();
  }

  /* =========================================================
     메인 루프
     ========================================================= */
  var lastT = 0;
  function frame(t) {
    window.requestAnimationFrame(frame);
    var dt;
    if (!lastT) dt = 1 / 60;
    else dt = (t - lastT) / 1000;
    lastT = t;
    if (!isFinite(dt) || dt <= 0) dt = 1 / 60;
    dt = Math.min(0.05, dt);

    update(dt);
    draw();
  }

  /* =========================================================
     이벤트 연결
     ========================================================= */
  function bindEvents() {
    canvas.addEventListener('pointerdown', onPointerDown, { passive: false });
    canvas.addEventListener('pointermove', onPointerMove, { passive: false });
    canvas.addEventListener('pointerup', onPointerUp);
    canvas.addEventListener('pointercancel', onPointerUp);
    canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    document.addEventListener('touchmove', function (e) {
      if (e.touches && e.touches.length > 1) e.preventDefault();
    }, { passive: false });
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);
    window.addEventListener('resize', function () {
      resize();
      if (FX.cx) fxSize();
    });
    window.addEventListener('orientationchange', function () {
      window.setTimeout(resize, 120);
    });

    if (window.ResizeObserver) {
      var ro = new ResizeObserver(function () { resize(); });
      ro.observe(canvas);
    }

    document.addEventListener('visibilitychange', function () {
      if (document.hidden && (S.state === 'play' || S.state === 'ready')) {
        S.prevState = S.state;
        S.state = 'pause';
        showOverlay('pause');
      }
    });

    overlayEl.addEventListener('click', function (e) {
      var target = e.target;
      var actionEl = null;
      while (target && target !== overlayEl) {
        if (target.getAttribute && target.getAttribute('data-action')) {
          actionEl = target;
          break;
        }
        target = target.parentNode;
      }
      var action = actionEl ? actionEl.getAttribute('data-action') : null;

      if (action === 'start') { startGame(); return; }
      if (action === 'restart') { restart(); return; }
      if (action === 'next') { nextStage(); return; }
      if (action === 'resume') { togglePause(); return; }
      if (action === 'copy') { copyLink(); return; }
      if (action === 'share') { shareLink(); return; }
      if (action === 'togglephoto') { togglePhotoOnly(); return; }

      if (S.state === 'start') startGame();
    });

    btnSound.addEventListener('click', function () {
      Sfx.enabled = !Sfx.enabled;
      storeSet(STORE_SOUND, Sfx.enabled ? '1' : '0');
      updateHud();
      if (Sfx.enabled) { Sfx.resume(); Sfx.tone(700, 0.08, 'triangle', 1000, 0.3); }
    });

    btnPause.addEventListener('click', function () {
      togglePause();
    });
  }

  /* =========================================================
     초기화
     ========================================================= */
  function init() {
    makeStars();
    bindEvents();
    var g0 = gridForStage(1, window.innerWidth || 390, Math.max(320, (window.innerHeight || 700) - 96));
    S.cols = g0.cols;
    S.rows = g0.rows;
    resize();
    S.W = S.W || 390;
    S.H = S.H || 600;
    S.paddle.x = S.W / 2;
    S.paddle.target = null;
    computeGeometry();
    buildBricks(1);
    resetBall();
    updateHud();
    hideOverlay();
    showOverlay('start');
    window.requestAnimationFrame(frame);
  }

  // 디버깅/검증용 (게임에는 영향 없음)
  window.__SBB = {
    S: S,
    api: {
      start: startGame,
      startGame: startGame,
      next: nextStage,
      launch: launch,
      pause: togglePause,
      resize: resize,
      buildBricks: buildBricks,
      computeGeometry: computeGeometry,
      brickRect: brickRect,
      update: update,
      draw: draw,
      equip: equip,
      multiBall: multiBall,
      destroyFamily: destroyFamily,
      itemPlanFor: itemPlanFor,
      gridForStage: gridForStage,
      fireBullet: fireBullet,
      fireLaser: fireLaser,
      dropCapsule: dropCapsule,
      damageBrick: damageBrick,
      updateWeapon: updateWeapon,
      state: function () {
        var alive = 0, items = 0, names = {};
        var aliveItems = [], fams = { red: 0, blue: 0, other: 0 };
        for (var i = 0; i < S.bricks.length; i++) {
          var b = S.bricks[i];
          if (b.alive) {
            alive++;
            names[b.name] = (names[b.name] || 0) + 1;
            if (b.item) { items++; aliveItems.push(b.item); }
            fams[b.fam] = (fams[b.fam] || 0) + 1;
          }
        }
        return {
          state: S.state, score: S.score, best: S.best, stage: S.stage,
          lives: S.lives, combo: S.combo, broken: S.broken,
          cols: S.cols, rows: S.rows, alive: alive, itemBricks: items, itemTypes: aliveItems,
          fams: fams, names: names, weapon: S.weapon.type, weaponLeft: Math.max(0, S.weapon.remaining),
          wide: Math.max(0, S.wide), shield: Math.max(0, S.shield),
          extraBalls: S.extraBalls.length, waves: S.waves.length, speed: Math.round(S.speed),
          bullets: S.bullets.length, beams: S.beams.length, capsules: S.capsules.length,
          brickW: Math.round(S.geo.w * 10) / 10, brickH: Math.round(S.geo.h * 10) / 10,
          font: Math.round(S.geo.font * 10) / 10, paddleW: Math.round(S.paddle.w),
          hudScore: scoreEl.textContent, hudItem: itemNameEl.textContent
        };
      }
    }
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
