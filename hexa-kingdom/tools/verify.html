<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>hexa verify</title>
<style>body{font:12px/1.4 monospace;background:#111;color:#0f0;white-space:pre-wrap;padding:8px}</style>
</head>
<body>
<div id="out">running…</div>
<script type="module">
import { CFG } from '../js/config.js';
import { Board } from '../js/core/board.js';
import { applyGravity, countEmptyPlayable } from '../js/core/gravity.js';

const out = document.getElementById('out');
const log = [];
const say = (s) => { log.push(s); out.textContent = log.join('\n'); };
const R = (seed => () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296)(7);

function checkBoard(b, label) {
  const problems = [];
  for (let r = 0; r < b.rows; r++) {
    for (let c = 0; c < b.cols; c++) {
      const t = b.grid[r][c];
      if (!t) {
        if (!b.isBlockedCell(r, c)) problems.push(`empty playable ${r},${c}`);
        continue;
      }
      if (b.isBlockedCell(r, c) && b.obstacleAt(r, c)?.blocksTile) problems.push(`tile under blocker ${r},${c}`);
    }
  }
  // duplicate tile ids
  const seen = new Set();
  for (let r = 0; r < b.rows; r++) for (let c = 0; c < b.cols; c++) {
    const t = b.grid[r][c];
    if (!t) continue;
    if (seen.has(t.id)) problems.push(`duplicate tile ${t.id} at ${r},${c}`);
    seen.add(t.id);
  }
  if (problems.length) say(`FAIL ${label}: ${problems.slice(0, 4).join(' | ')} (${problems.length})`);
  return problems.length;
}

async function loadLevel(world, level) {
  const res = await fetch(`../levels/world${world}/level${level}.json`, { cache: 'no-cache' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

(async () => {
  let levels = 0, runs = 0, fails = 0, bushRuns = 0;
  const t0 = performance.now();
  for (let w = 1; w <= 5; w++) {
    for (let lv = 1; lv <= 20; lv++) {
      let data;
      try { data = await loadLevel(w, lv); } catch (e) { say(`SKIP level ${w}-${lv}: ${e.message}`); continue; }
      levels++;
      for (let iter = 0; iter < 40; iter++) {
        const b = new Board(data, {});
        await b.init();
        // 무작위로 보석을 지운다(덤불·상자 아래 포함)
        const culls = 1 + Math.floor(R() * 10);
        for (let k = 0; k < culls; k++) {
          const r = Math.floor(R() * b.rows), c = Math.floor(R() * b.cols);
          if (b.isBlockedCell(r, c)) continue;
          b.grid[r][c] = null;
        }
        // iter % 3 === 2 이면 장애물 하나를 부순 상태로도 시험
        if (iter % 3 === 2) {
          const keys = [...b.obstacles.keys()];
          if (keys.length) {
            const k = keys[Math.floor(R() * keys.length)];
            const [r, c] = k.split(',').map(Number);
            b.obstacles.get(k).dead = true;
            b.obstacles.delete(k);
            b.grid[r][c] = null;
            bushRuns++;
          }
        }
        applyGravity(b);
        runs++;
        fails += checkBoard(b, `w${w}-${lv}#${iter}`) ? 1 : 0;
      }
    }
  }
  say(`gravity: levels=${levels} runs=${runs} brokenObstacleRuns=${bushRuns} failingRuns=${fails} in ${Math.round(performance.now() - t0)}ms`);

  // ── 신규 부스터 스모크 테스트(부스터마다 새 보드) ──────
  const results = {};
  for (const kind of ['hammer', 'drill', 'bomber', 'magicHat', 'lightning', 'prism', 'hourglass']) {
    try {
      const b = new Board(await loadLevel(1, 3), {});
      await b.init();
      b.goals.list.length = 0;            // 승리 판정 없이 보드만 시험
      const before = b.moves;
      const ok = await b.useBooster(kind, 3, 3);
      results[kind] = ok ? 'ok' : 'false';
      if (kind === 'hourglass') results[kind] = b.moves === before + 3 ? 'ok(+3)' : `moves ${before}->${b.moves}`;
      const bad = checkBoard(b, `booster ${kind}`);
      if (bad) results[kind] += ' BOARD_BROKEN';
    } catch (e) {
      results[kind] = 'ERR ' + e.message;
    }
  }
  try {
    const b = new Board(await loadLevel(1, 3), {});
    await b.init();
    b.goals.list.length = 0;
    const ok = await b.freeSwap(4, 4, 4, 5);
    results.swap = ok ? 'ok' : 'false';
    if (checkBoard(b, 'freeSwap')) results.swap += ' BOARD_BROKEN';
  } catch (e) { results.swap = 'ERR ' + e.message; }

  // 보너스 보석
  const bonus = {};
  const b2 = new Board(await loadLevel(1, 3), {});
  await b2.init();
  for (const t of ['coin', 'moves', 'strike', 'x2']) {
    try {
      const tile = b2.grid[1]?.[1];
      if (!tile) { bonus[t] = 'no tile'; continue; }
      tile.bonus = t;
      const movesBefore = b2.moves;
      b2.collectBonus(1, 1, tile);
      bonus[t] = t === 'moves' ? (b2.moves === movesBefore + CFG.bonus.moves ? 'ok' : 'moves-wrong')
        : t === 'x2' ? (b2.bonusFx.x2 === CFG.bonus.x2Turns ? 'ok' : 'x2-wrong')
        : t === 'strike' ? (b2.bonusFx.pendingStrike > 0 ? 'ok' : 'strike-wrong') : 'ok';
    } catch (e) { bonus[t] = 'ERR ' + e.message; }
  }
  try { await b2.processStrikes(); bonus.strikeRun = 'ok'; if (checkBoard(b2, 'strike')) bonus.strikeRun = 'BOARD_BROKEN'; }
  catch (e) { bonus.strikeRun = 'ERR ' + e.message; }

  // 실제 보드에서 보너스 스폰 → 매치로 획득 루프
  try {
    const bs2 = new Board(await loadLevel(1, 2), {});
    await bs2.init();
    bs2.goals.list.length = 0;
    const t = bs2.maybeSpawnBonus();
    bonus.spawn = t || 'none';
    const bt = bs2.bonusTiles()[0];
    if (bt) { bs2.collectBonus(bt.r, bt.c, bt.tile); bonus.collect = 'ok'; }
  } catch (e) { bonus.spawn = 'ERR ' + e.message; }

  // 무작위 스왑 40회 (실제 플레이 루프) — 빈 칸 0 확인
  const bs = new Board(await loadLevel(1, 3), {});
  await bs.init();
  let swapFails = 0;
  for (let i = 0; i < 40; i++) {
    const r = Math.floor(R() * 8), c = Math.floor(R() * 7);
    try { await bs.trySwap(r, c, r, c + 1); } catch (e) { say('swap ERR ' + e.message); }
    if (countEmptyPlayable(bs) > 0) { swapFails++; say(`empty cells after swap ${i}: ${countEmptyPlayable(bs)}`); }
  }
  say(`summary: ${JSON.stringify({ emptyCells: bs.summary().emptyCells, moves: bs.moves, score: bs.score, state: bs.state })}`);

  say('boosters: ' + JSON.stringify(results));
  say('bonus: ' + JSON.stringify(bonus));
  say(`playLoop: 40 swaps, emptyCellFailures=${swapFails}`);
  say('CONFIG lives: ' + JSON.stringify({ costOnStart: CFG.lives.costOnStart, costOnFail: CFG.lives.costOnFail, recoveryMin: CFG.lives.recoveryMs / 60000 }));
  say('DONE ' + (fails === 0 && swapFails === 0 ? 'PASS' : 'FAIL'));
  window.__RESULT = { fails, swapFails, results, bonus, levels, runs };
  document.title = fails === 0 && swapFails === 0 ? 'VERIFY-PASS' : 'VERIFY-FAIL';
})().catch(e => { say('FATAL ' + e.message + '\n' + e.stack); document.title = 'VERIFY-ERROR'; });
</script>
</body>
</html>
