<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>hexa cleanup</title></head>
<body style="background:#111;color:#0f0;font:12px monospace;padding:10px">
<div id="o">resetting…</div>
<script>
/* 검증으로 생긴 기록을 지우고 새 플레이어 상태로 되돌린다(닉네임·방 코드·uid는 유지) */
try {
  const KEY = 'hexaKingdom.profile.v1';
  const d = JSON.parse(localStorage.getItem(KEY) || '{}');
  const fresh = {
    version: 1,
    uid: d.uid || null,
    name: d.name || '',
    createdAt: d.createdAt || Date.now(),
    coins: 600,
    hammerTokens: 3,
    xp: 0,
    playerLevel: 1,
    stars: {},
    cleared: {},
    bestScores: {},
    tasks: {},
    lives: { count: 5, nextAt: 0 },
    streak: { levelId: '', count: 0 },
    boosters: {
      hammer: 2, drill: 1, bomber: 1, magicHat: 0,
      swap: 1, lightning: 1, prism: 1, hourglass: 1,
      startRocket: 1, startTnt: 1, startSpinner: 0,
    },
    settings: d.settings || { muted: false, music: true, sfx: true },
    lastPlayed: { world: 1, level: 1 },
    weekly: { weekId: '', best: 0 },
    roomCode: d.roomCode || '',
    stats: { plays: 0, wins: 0, blitzPlays: 0, tasks: 0 },
    updatedAt: Date.now(),
    createdLocally: false,
  };
  localStorage.setItem(KEY, JSON.stringify(fresh));
  document.getElementById('o').textContent = 'reset ok';
} catch (e) { document.getElementById('o').textContent = 'ERR ' + e.message; }
setTimeout(() => location.replace('../index.html?reset=1'), 800);
</script>
</body>
</html>
