<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>hexa seed3</title></head>
<body style="background:#111;color:#0f0;font:12px monospace;padding:10px">
<div id="o">seeding…</div>
<script>
/* 임시 검증용: 목숨 0 상태 만들기(충전 버튼 확인) */
try {
  const KEY = 'hexaKingdom.profile.v1';
  const d = JSON.parse(localStorage.getItem(KEY) || '{}');
  d.lives = { count: 0, nextAt: Date.now() + 15 * 60 * 1000 };
  d.coins = Math.max(d.coins || 0, 450);
  d.updatedAt = Date.now();
  localStorage.setItem(KEY, JSON.stringify(d));
  document.getElementById('o').textContent = 'lives=0 coins=' + d.coins;
} catch (e) { document.getElementById('o').textContent = 'ERR ' + e.message; }
setTimeout(() => location.replace('../tools/mobile.html?v=seed3'), 700);
</script>
</body>
</html>
