<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1712" />
  <title>헥사 킹덤 (HEXA KINGDOM) — 매치3 어드벤처</title>
  <meta name="description" content="견습 기사 루크와 요정 피피가 저주에 잠든 5개 월드를 되살리는 매치3 퍼즐 어드벤처. 100개의 마을 복구 과제, 주간 블리츠, 친구와 함께하는 우리 방 랭킹." />
  <meta property="og:title" content="헥사 킹덤 (HEXA KINGDOM)" />
  <meta property="og:description" content="견습 기사 루크와 요정 피피의 매치3 어드벤처 — 5개 월드, 100개 복구 과제, 주간 블리츠." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="./og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b1712'/%3E%3Cpath d='M16 5l9 5v7c0 6-4 9-9 11-5-2-9-5-9-11V10z' fill='%23ffd166'/%3E%3Cpath d='M16 11l4 2.4v3.2c0 2.6-1.8 4-4 5-2.2-1-4-2.4-4-5v-3.2z' fill='%230b1712'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div id="app">
    <div id="bg-photo" aria-hidden="true">
      <div class="bp" id="bg-photo-a"></div>
      <div class="bp" id="bg-photo-b"></div>
    </div>
    <canvas id="bg" aria-hidden="true"></canvas>
    <div id="boot" class="screen boot">
      <div class="logo-big">
        <div class="l1">HEXA KINGDOM</div>
        <div class="l2">헥사 킹덤</div>
      </div>
      <div class="spinner" aria-label="불러오는 중"></div>
      <div class="tiny muted" id="boot-text">왕국을 불러오는 중…</div>
    </div>

    <div id="screen-home" class="screen hidden"></div>

    <div id="screen-game" class="screen hidden">
      <div class="game-head" id="game-head"></div>
      <div id="boss-slot"></div>
      <div class="board-stage">
        <div class="board-inner" id="board-inner">
          <canvas id="board" aria-label="퍼즐 보드"></canvas>
          <canvas id="fx"></canvas>
        </div>
      </div>
      <div class="game-goals" id="game-goals"></div>
      <div class="game-boosters" id="game-boosters"></div>
      <div class="banner" id="banner"></div>
    </div>

    <div id="modal-root"></div>
    <div id="toast-root"></div>
  </div>
  <noscript>이 게임을 하려면 JavaScript 를 켜 주세요.</noscript>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
