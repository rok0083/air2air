<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>헥사 블리츠 HEXA BLITZ — 2분 매치3 퍼즐</title>
<meta name="description" content="2분(120초) 동안 최대한 많은 보석을 터뜨려라! 7가지 모양 보석, 7종 특수 보석, 콤보·피버·라스트 허라로 친구들과 점수 대결. 외국 바다·해변 배경의 무료 웹 게임." />
<meta name="theme-color" content="#061420" />
<meta property="og:type" content="website" />
<meta property="og:title" content="헥사 블리츠 HEXA BLITZ — 2분 매치3 퍼즐" />
<meta property="og:description" content="2분 블리츠! 7종 특수 보석·콤보·피버·라스트 허라로 최고 점수에 도전하세요." />
<meta property="og:image" content="https://rok0083.github.io/air2air/hexa/og-image.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:url" content="https://rok0083.github.io/air2air/hexa/" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="헥사 블리츠 HEXA BLITZ" />
<meta name="twitter:description" content="2분 블리츠! 7종 특수 보석·콤보·피버·라스트 허라 퍼즐." />
<meta name="twitter:image" content="https://rok0083.github.io/air2air/hexa/og-image.png" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23071424'/><polygon points='50,12 88,33 88,67 50,88 12,67 12,33' fill='%233f8dff' stroke='%23bfe0ff' stroke-width='4'/><circle cx='50' cy='50' r='14' fill='%23ffd23d'/></svg>" />
<link rel="preload" as="image" href="assets/beach-bg.jpg" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="bg-layer" aria-hidden="true"></div>

<main id="app">

  <!-- ───────────── 시작 화면 ───────────── -->
  <section id="screen-start" class="screen active">
    <div class="start-card glass">
      <div class="logo">
        <div class="logo-gems" aria-hidden="true">
          <i class="g1"></i><i class="g2"></i><i class="g3"></i>
        </div>
        <h1>헥사 블리츠</h1>
        <p class="logo-sub">HEXA BLITZ · 2MIN MATCH-3</p>
      </div>

      <p class="tagline">2분 안에 최대한 많이 터뜨려라!<br/>콤보 · 피버 · 라스트 허라</p>

      <label class="field">
        <span class="field-label">닉네임</span>
        <input id="input-name" class="input" type="text" maxlength="12" autocomplete="nickname"
               placeholder="2~12자 · 한글/영문/숫자" />
      </label>

      <div class="field">
        <span class="field-label">방 코드 <em>(선택)</em></span>
        <div class="room-row">
          <input id="input-room" class="input" type="text" maxlength="6" autocapitalize="characters" placeholder="예: ABC123" />
          <button id="btn-make-room" class="btn ghost small" type="button">방 만들기</button>
        </div>
      </div>

      <p id="start-msg" class="msg" aria-live="polite"></p>

      <button id="btn-start" class="btn primary big" type="button">게임 시작</button>
      <button id="btn-rank" class="btn ghost" type="button">랭킹</button>

      <p class="hint">보석을 드래그하거나 두 번 탭해서 교체 · 3개 이상 맞추면 제거</p>
    </div>
  </section>

  <!-- ───────────── 게임 화면 ───────────── -->
  <section id="screen-game" class="screen">
    <div class="game-top">
      <button id="btn-quit" class="icon-btn" type="button" title="그만하기">✕</button>
      <div class="hud">
        <div class="hud-box score"><span>점수</span><b id="hud-score">0</b></div>
        <div class="hud-box"><span>콤보</span><b id="hud-combo">0</b></div>
        <div class="hud-box"><span>배율</span><b id="hud-mult">×1.0</b></div>
      </div>
      <button id="btn-pause" class="icon-btn" type="button" title="일시정지">⏸</button>
    </div>

    <div class="time-row">
      <div class="time-bar"><i id="time-fill"></i><b id="time-text">2:00</b></div>
    </div>

    <div class="board-wrap">
      <canvas id="board"></canvas>
      <div id="board-flash" class="board-flash" aria-hidden="true"></div>
      <div id="banner" class="banner" aria-hidden="true"></div>
      <div id="pause-overlay" class="overlay" hidden>
        <h2>일시정지</h2>
        <button id="btn-resume" class="btn primary" type="button">계속하기</button>
        <button id="btn-quit2" class="btn ghost" type="button">그만하기</button>
      </div>
    </div>

    <div class="fever-row">
      <div class="fever-label">FEVER</div>
      <div class="fever-bar"><i id="fever-fill"></i></div>
      <div id="fever-text" class="fever-text">0%</div>
    </div>

    <div class="boosters" id="boosters"></div>
  </section>

  <!-- ───────────── 게임 오버 ───────────── -->
  <section id="screen-over" class="screen">
    <div class="over-card glass">
      <p class="over-kicker">TIME UP!</p>
      <h2 id="over-score" class="over-score">0</h2>
      <p id="over-rank" class="over-rank">순위 계산 중…</p>
      <div class="stat-grid">
        <div><span>최고 콤보</span><b id="over-combo">0</b></div>
        <div><span>특수 보석</span><b id="over-specials">0</b></div>
        <div><span>콤보 달성</span><b id="over-combos">0</b></div>
        <div><span>라스트 허라</span><b id="over-hurrah">0</b></div>
        <div><span>최고 배율</span><b id="over-mult">×1.0</b></div>
        <div><span>방 코드</span><b id="over-room">전체</b></div>
      </div>
      <p id="over-save" class="msg"></p>
      <button id="btn-again" class="btn primary big" type="button">다시 하기</button>
      <div class="row2">
        <button id="btn-over-rank" class="btn ghost" type="button">랭킹</button>
        <button id="btn-share" class="btn ghost" type="button">공유</button>
      </div>
      <button id="btn-over-home" class="btn text" type="button">처음으로</button>
    </div>
  </section>

  <!-- ───────────── 랭킹 ───────────── -->
  <section id="screen-rank" class="screen">
    <div class="rank-card glass">
      <div class="rank-head">
        <button id="btn-rank-back" class="icon-btn" type="button" title="뒤로">←</button>
        <h2>랭킹</h2>
        <span class="rank-room" id="rank-room">전체</span>
      </div>
      <div class="tabs" id="rank-tabs"></div>
      <p class="rank-status" id="rank-status" hidden></p>
      <ol class="rank-list" id="rank-list"></ol>
      <p class="rank-foot" id="rank-foot" hidden></p>
    </div>
  </section>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <button id="btn-sound" class="sound-toggle" type="button" title="소리 켜기/끄기">🔊</button>
</main>

<script>
/* 진단용: 로드 중 오류 수집 (동작에는 영향 없음) */
window.__hexaErrors = [];
window.addEventListener('error', e => window.__hexaErrors.push(String((e && e.message) || e)));
window.addEventListener('unhandledrejection', e => window.__hexaErrors.push('rejection: ' + String((e.reason && e.reason.message) || e.reason)));
</script>
<script type="module" src="js/ui.js"></script>
</body>
</html>
