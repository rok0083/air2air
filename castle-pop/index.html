<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1f4fd8" />
  <title>캐슬 팝 (CASTLE POP) — 로열 매치3 퍼즐</title>
  <meta name="description" content="사자 임금 레오와 부엉이 집사 올리가 퍼즐로 별을 모아 낡은 성을 되살리는 매치3 퍼즐. 5개 구역 100레벨, 파워업 조합, 미니게임, 실시간 랭킹." />
  <meta property="og:title" content="캐슬 팝 (CASTLE POP)" />
  <meta property="og:description" content="레오 임금과 올리 집사가 별로 성을 되살리는 밝고 빠른 매치3 퍼즐 — 5개 구역 100레벨." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="./og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f4fd8'/%3E%3Cpath d='M16 6l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L16 21l-6.1 3.4 1.5-6.8L6.2 13l6.9-.7z' fill='%23ffd23f'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Baloo+2:wght@600;800&display=swap" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div id="app">
    <canvas id="bg" aria-hidden="true"></canvas>

    <!-- 부팅 -->
    <div id="screen-boot" class="screen boot">
      <div class="boot-logo">
        <div class="boot-crown">👑</div>
        <div class="boot-title">CASTLE POP</div>
        <div class="boot-sub">캐슬 팝</div>
      </div>
      <div class="boot-bar"><i></i></div>
      <div class="boot-text" id="boot-text">성을 불러오는 중…</div>
    </div>

    <!-- 홈 -->
    <div id="screen-home" class="screen hidden">
      <div class="home-top" id="home-top"></div>
      <div class="home-stage">
        <canvas id="castle" aria-label="성 일러스트"></canvas>
        <div class="home-side left" id="home-events-left"></div>
        <div class="home-side right" id="home-events-right"></div>
        <button class="task-btn" id="task-btn" type="button">
          <span class="task-ico">📋</span><span>과제</span><span class="task-badge" id="task-badge">0</span>
        </button>
        <div class="home-bottom">
          <button class="play-btn" id="play-btn" type="button">
            <span class="play-label">레벨 <b id="play-level">1</b></span>
            <span class="play-go">▶</span>
          </button>
          <div class="home-streak" id="home-streak"></div>
        </div>
      </div>
      <nav class="home-tabs" id="home-tabs">
        <button class="tab active" data-tab="home" type="button"><i>🏰</i><span>홈</span></button>
        <button class="tab" data-tab="rank" type="button"><i>🏆</i><span>랭킹</span></button>
        <button class="tab" data-tab="event" type="button"><i>🎪</i><span>이벤트</span></button>
        <button class="tab" data-tab="setting" type="button"><i>⚙️</i><span>설정</span></button>
      </nav>
    </div>

    <!-- 레벨 -->
    <div id="screen-game" class="screen hidden">
      <div class="hud" id="hud">
        <div class="hud-band"></div>
        <div class="hud-goals" id="hud-goals"></div>
        <div class="hud-king" id="hud-king">
          <canvas id="king-canvas" aria-label="레오 임금"></canvas>
        </div>
        <div class="hud-moves" id="hud-moves">
          <div class="ribbon mini">이동 횟수</div>
          <div class="cream panel-moves"><span id="moves-num">25</span></div>
        </div>
        <button class="hud-close" id="hud-close" type="button" aria-label="설정">⚙️</button>
      </div>
      <div class="board-stage">
        <canvas id="board" aria-label="퍼즐 보드"></canvas>
        <canvas id="fx" aria-hidden="true"></canvas>
        <div class="callout" id="callout"></div>
      </div>
      <div class="tray" id="tray"></div>
      <div class="tray-hint" id="tray-hint">← 밀어서 더 보기 →</div>
      <div class="game-toast" id="game-toast"></div>
    </div>

    <div id="modal-root"></div>
    <div id="toast-root"></div>
    <div id="curtain" class="curtain"></div>
  </div>
  <noscript>이 게임을 하려면 JavaScript 를 켜 주세요.</noscript>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
